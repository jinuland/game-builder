<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>스노우 로얄 (Snow Royale)</title><style>
/* Snow Royale — cold snow-battle-royale UI. Palette per spec. */
:root {
  --white:#F5F5F5; --ice:#A8D8EA; --navy:#1B2A4A; --orange:#FF6B35;
  --slate:#4A4A5A; --gold:#D4A017; --crimson:#DC143C; --aurora:#7FFFD4; --grey:#9E9E9E;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--navy); color: var(--white);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
#game { width: 100vw; height: 100vh; }
.sr-root { position: relative; width: 100%; height: 100%; background: var(--navy); }
.sr-canvas { position: absolute; inset: 0; display: block; cursor: crosshair; }

.sr-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(27,42,74,0.72); backdrop-filter: blur(4px); z-index: 20; }

/* title */
.sr-title, .sr-result { text-align: center; max-width: 640px; padding: 20px; }
.sr-title h1 { font-size: 56px; margin: 0; color: var(--ice); text-shadow: 0 0 24px rgba(168,216,234,0.6); letter-spacing: 0.05em; }
.sr-sub { color: rgba(245,245,245,0.75); font-size: 16px; }
.sr-diffrow { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
.sr-diff { background: rgba(255,255,255,0.08); border: 1px solid var(--ice); color: var(--white); border-radius: 8px; padding: 8px 18px; cursor: pointer; }
.sr-diff.on { background: var(--ice); color: var(--navy); font-weight: 700; }
.sr-btn { display: block; width: 260px; margin: 8px auto; padding: 12px; background: rgba(255,255,255,0.08);
  border: 1px solid var(--ice); border-radius: 10px; color: var(--white); font-size: 15px; cursor: pointer; }
.sr-btn:hover { background: rgba(168,216,234,0.2); }
.sr-btn.primary { background: var(--orange); border-color: var(--orange); color: #1a0d00; font-weight: 700; }
.sr-btn.primary:hover { background: #ff8355; }
.sr-foot { font-size: 12px; color: rgba(245,245,245,0.55); margin-top: 16px; line-height: 1.5; }

/* result */
.sr-place { font-size: 84px; font-weight: 900; line-height: 1; }
.sr-win .sr-place { color: var(--gold); text-shadow: 0 0 30px var(--gold); }
.sr-lose .sr-place { color: var(--ice); }
.sr-rstats { display: flex; gap: 26px; justify-content: center; margin: 18px 0; }
.sr-stat-v { font-size: 30px; font-weight: 800; color: var(--ice); }
.sr-stat-l { font-size: 12px; color: rgba(245,245,245,0.6); }

/* modal */
.sr-modal { position: absolute; inset: 0; background: rgba(13,27,42,0.85); display: flex; align-items: center; justify-content: center; z-index: 40; }
.sr-modal-box { background: var(--navy); border: 1px solid var(--ice); border-radius: 14px; padding: 24px; max-width: 560px; }
.sr-modal-box h2 { color: var(--ice); margin-top: 0; }
.sr-modal-box p { line-height: 1.6; font-size: 14px; color: rgba(245,245,245,0.9); }

/* HUD */
.sr-hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-size: 14px; }
.sr-hud-top { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; align-items: center;
  background: rgba(13,27,42,0.7); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(168,216,234,0.3); }
.sr-hud-surv { font-weight: 800; color: var(--aurora); }
.sr-hud-act { color: var(--ice); font-size: 13px; }
.sr-hud-zone { color: var(--orange); font-weight: 700; font-size: 13px; }
.sr-hud-bl { position: absolute; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 6px; width: 240px; }
.sr-hp { position: relative; height: 26px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); transform: skewX(-8deg); }
.sr-hp-fill { position: absolute; inset: 0; transition: width 0.12s; }
.sr-hp-txt { position: relative; display: block; text-align: center; line-height: 26px; font-size: 15px; font-weight: 800; text-shadow: 0 1px 2px #000; transform: skewX(8deg); }
.sr-tac { font-size: 12px; color: var(--ice); text-shadow: 0 1px 2px #000; }
.sr-drop { font-size: 13px; color: var(--orange); font-weight: 700; }
/* FPS-style ammo counter bottom-right */
.sr-hud-br { position: absolute; right: 24px; bottom: 20px; text-align: right; }
.sr-ammo-big { font-size: 52px; font-weight: 900; line-height: 1; color: var(--white); text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.sr-ammo-cap { font-size: 10px; letter-spacing: 0.2em; color: var(--ice); margin: 2px 0 6px; }
/* kill feed */
.sr-killfeed { position: absolute; right: 16px; top: 56px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.sr-kf-row { background: rgba(13,27,42,0.72); border-left: 3px solid var(--orange); color: var(--white); font-size: 12px; padding: 4px 10px; border-radius: 3px; }
.sr-minimap { position: absolute; right: 16px; top: 16px; border: 2px solid var(--ice); border-radius: 8px; overflow: hidden; }
.sr-toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(13,27,42,0.92);
  border: 1px solid var(--orange); color: var(--white); padding: 10px 18px; border-radius: 8px; font-size: 14px; max-width: 80%; text-align: center; }

@media (max-width: 720px) {
  .sr-title h1 { font-size: 40px; }
  .sr-btn { width: 220px; }
  .sr-hud-bl { width: 170px; }
}

</style></head>
<body><div id="game"></div><script>
/* Snow Royale — single-file build (all modules, one IIFE scope). */
(function(){
"use strict";

/* ===== rng.js ===== */
// Deterministic seeded PRNG (mulberry32). Pure — enables reproducible balance
// simulation (seed=42) and identical replay. Never uses Math.random in logic.
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const rng = () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (n) => Math.floor(rng() * n);
  rng.range = (lo, hi) => lo + rng() * (hi - lo);
  rng.pick = (arr) => arr[rng.int(arr.length)];
  return rng;
}


/* ===== config.js ===== */
// Snow Royale balance & content config. Single source of truth for all tunable
// numbers (referenced by spec's balance/pass criteria). Pure data.

const CONFIG = {
  map: { size: 1200, snowPiles: 40, pileRadius: 1.5 * 10, pileCooldown: 60 }, // world units; pile interact radius scaled ~x10 for readable top-down
  player: { maxHp: 100, radius: 12, speed: 150, coverSpeedMul: 0.6 },
  craft: { seconds: 3, yield: 10, interactRange: 34 },
  throw: {
    minChargeMs: 200, maxChargeMs: 1500, minRange: 100, maxRange: 400,
    speed: 320, damage: 14, coverDamageMul: 0.5, radius: 6, hitChanceBase: 0.5,
  },
  wall: { cost: 4, durability: 3, maxPerPlayer: 2, decaySec: 14, len: 40, dist: 28, blockChance: 0.65 },
  decoy: { cost: 5, maxPerPlayer: 2, lureSec: 3, dist: 40 },
  // Zone is the metronome: it must close enough to force endgame within 8-12 min.
  zone: {
    firstShrinkSec: 75, intervalSec: 48, dps: 10, finalRadius: 40,
    startRadiusFactor: 0.72, shrinkStep: 0.26,
  },
  match: { total: 20, npc: 19, warmupSec: 45, engageRange: 170, fleeRange: 130 },
  // Low aggro + long reactSec keeps time-to-kill high so ~19 eliminations spread
  // across an 8-12 min match; the closing zone finishes stragglers.
  npcDifficulty: {
    easy:   { accuracy: 0.34, reactSec: 3.4, craftThreshold: 5, aggro: 0.07 },
    normal: { accuracy: 0.42, reactSec: 2.8, craftThreshold: 6, aggro: 0.09 },
    hard:   { accuracy: 0.6, reactSec: 2.0, craftThreshold: 7, aggro: 0.15 },
  },
  session: { targetMinSec: 8 * 60, targetMaxSec: 12 * 60 },
};

// The 5 narrative acts, derived from spec. Each maps to a match phase, tracked
// by elapsed time / survivor count for HUD storytelling.
const ACTS = [
  { n: 1, title: '막 1 — 낙하와 첫 눈뭉치 제작', untilSurvivors: 20 },
  { n: 2, title: '막 2 — 눈뭉치 교전과 재보급', untilSurvivors: 15 },
  { n: 3, title: '막 3 — 설벽 건설과 제작 엄폐', untilSurvivors: 10 },
  { n: 4, title: '막 4 — 좁아지는 눈보라 구역', untilSurvivors: 5 },
  { n: 5, title: '막 5 — 최후의 눈싸움', untilSurvivors: 1 },
];

function actForSurvivors(survivors) {
  for (const a of ACTS) if (survivors >= a.untilSurvivors) return a;
  return ACTS[ACTS.length - 1];
}

// Character skins → asset keys (HUD portrait + NPC distinction).
const SKINS = {
  jack: { name: '아이언 잭', asset: 'char_jack', color: '#1B2A4A' },
  white: { name: '화이트 아이', asset: 'char_white', color: '#A8D8EA' },
  bear: { name: '빅 베어', asset: 'char_bear', color: '#D4A017' },
  bot: { name: '[봇] 그레이 솔저', asset: 'char_bot', color: '#9E9E9E' },
};


/* ===== audio.js ===== */
// Procedural Web Audio for Snow Royale. All sound synthesized at runtime (no
// external files). Ambient BGM loop that speeds up as survivors drop, craft-time
// heartbeat with BGM ducking, and SFX moments. Starts only after a user gesture.
class AudioEngine {
  constructor() {
    this.ctx = null; this.master = null; this.bgm = null; this.sfx = null;
    this.started = false; this.muted = false; this.bpm = 92; this.timer = null; this.step = 0;
    this.ducked = false;
  }
  init() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
    this.bgm = this.ctx.createGain(); this.bgm.gain.value = 0.28; this.bgm.connect(this.master);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.7; this.sfx.connect(this.master);
    this.started = true;
    this._startBgm();
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; }

  _tone(freq, dur, type = 'sine', vol = 0.4, glide = 0, dest = this.sfx) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime; const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + glide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.02);
  }
  _noise(dur, vol = 0.4, hp = 800) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime; const n = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    src.connect(f); f.connect(g); g.connect(this.sfx); src.start(t);
  }

  // SFX moments (spec soundMoments)
  landing() { this._noise(0.2, 0.5, 300); this._tone(120, 0.15, 'sine', 0.3); }
  craftStart() { this._duck(true); }
  craftTick() { this._tone(70, 0.12, 'sine', 0.5); } // heartbeat
  craftDone() { this._duck(false); this._tone(880, 0.1, 'sine', 0.4, 200); }
  craftCancel() { this._duck(false); this._tone(200, 0.2, 'sawtooth', 0.3, -120); }
  throw() { this._noise(0.12, 0.25, 1200); }
  hit() { this._noise(0.15, 0.5, 500); this._tone(90, 0.12, 'square', 0.3, -30); }
  wall() { this._tone(140, 0.18, 'square', 0.35); this._tone(1200, 0.12, 'sine', 0.2); }
  decoy() { this._tone(500, 0.12, 'triangle', 0.3, 200); }
  zoneWarn() { this._tone(70, 0.5, 'sawtooth', 0.35, 20); }
  fanfare() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this._tone(f, 0.5, 'triangle', 0.35), i * 120)); }
  gameover() { this._tone(180, 0.6, 'sawtooth', 0.4, -120); this._noise(0.4, 0.4); }

  _duck(on) {
    if (!this.started) return;
    this.ducked = on;
    const t = this.ctx.currentTime;
    this.bgm.gain.cancelScheduledValues(t);
    this.bgm.gain.linearRampToValueAtTime(on ? 0.05 : 0.28, t + 0.15);
  }

  // BGM: looping arpeggio, tempo scales with setIntensity()
  _startBgm() {
    const notes = [220, 277, 330, 262, 330, 294];
    const tick = () => {
      if (!this.started) return;
      if (!this.muted && !this.ducked) {
        const f = notes[this.step % notes.length];
        this._tone(f, 0.28, 'triangle', 0.14, 0, this.bgm);
        if (this.step % notes.length === 0) this._tone(f / 2, 0.5, 'sine', 0.1, 0, this.bgm);
      }
      this.step++;
      this.timer = setTimeout(tick, 60000 / this.bpm / 2);
    };
    tick();
  }
  // survivors 20 -> bpm 92, survivors 5 -> ~132 (spec: +1.4x by 5 alive)
  setIntensity(survivors, total = 20) {
    const frac = 1 - Math.max(0, (survivors - 1)) / (total - 1);
    this.bpm = 92 + frac * 55;
  }
  stopAll() { if (this.timer) clearTimeout(this.timer); this.timer = null; this.started && (this.step = 0); }
}


/* ===== engine.js ===== */
// Snow Royale core engine — pure logic, no DOM/Canvas. Fixed-timestep simulation
// usable by both the browser render loop and the headless balance simulator.
// All mutations flow through setters; no external `x.hp =` writes allowed.


let _uid = 1;
const uid = () => _uid++;

// ---- construction --------------------------------------------------------
function createGame(seed = 42, opts = {}) {
  const rng = makeRng(seed);
  const g = {
    seed, rng,
    t: 0,                    // elapsed seconds
    phase: 'drop',           // drop | play | over
    over: false, won: false, winner: null,
    difficulty: opts.difficulty || 'normal',
    players: [],             // all combatants (index 0 = human unless sim)
    snowballs: [],           // active projectiles
    walls: [], decoys: [],
    piles: [],               // {x,y,cooldownUntil}
    zone: { cx: C.map.size / 2, cy: C.map.size / 2, radius: C.map.size * C.zone.startRadiusFactor, nextShrink: C.zone.firstShrinkSec, shrinks: 0 },
    events: [],              // telemetry event log
    placementOrder: [],      // ids in order of elimination (last = winner)
    kills: {},               // id -> kill count
    _humanId: opts.humanId ?? 1,
    stats: { craftAttempts: 0, craftDone: 0, craftCancel: 0, throws: 0, hits: 0, wallsBuilt: 0, decoys: 0, zoneDamageTicks: 0, zoneDamageTotal: 0, totalDamage: 0 },
  };
  spawnPiles(g);
  spawnPlayers(g, opts);
  return g;
}

function spawnPiles(g) {
  const m = C.map.size;
  for (let i = 0; i < C.map.snowPiles; i++) {
    g.piles.push({ id: uid(), x: g.rng.range(60, m - 60), y: g.rng.range(60, m - 60), cooldownUntil: 0 });
  }
}

function spawnPlayers(g, opts) {
  const total = opts.total ?? C.match.total;
  const m = C.map.size;
  const skinKeys = ['jack', 'white', 'bear'];
  // Spread spawns evenly on a jittered grid so players start far apart (no instant
  // early bloodbath). 20 players -> 5x4 grid across the map.
  const cols = 5, rows = Math.ceil(total / cols);
  const cellW = m / cols, cellH = m / rows;
  const order = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) order.push([c, r]);
  for (let i = 0; i < total; i++) {
    const isHuman = !opts.allNpc && i === 0;
    const id = g._humanId != null && isHuman ? g._humanId : uid();
    const [gc, gr] = order[i % order.length];
    const p = {
      id, isHuman, isNpc: !isHuman,
      name: isHuman ? '아이언 잭' : `[봇] ${['그레이', '프로스트', '아이시클', '블리자드'][i % 4]}-${i}`,
      skin: isHuman ? 'jack' : (i % 3 === 0 ? 'bot' : skinKeys[i % 3]),
      hp: C.player.maxHp, alive: true,
      x: Math.min(m - 40, Math.max(40, gc * cellW + cellW / 2 + g.rng.range(-cellW * 0.3, cellW * 0.3))),
      y: Math.min(m - 40, Math.max(40, gr * cellH + cellH / 2 + g.rng.range(-cellH * 0.3, cellH * 0.3))),
      aim: g.rng.range(0, Math.PI * 2),
      snowballs: 0,
      crafting: false, craftTimer: 0, craftPile: null,
      cover: false,
      walls: 0, decoys: 0,
      npc: isHuman ? null : { state: 'PATROL', target: null, reactTimer: 0, moveTx: 0, moveTy: 0, wantCraft: false, aimError: 0 },
      diff: g.difficulty,
    };
    g.kills[id] = 0;
    g.players.push(p);
  }
}

// ---- setters -------------------------------------------------------------
function setHp(g, p, v) {
  const nv = Math.max(0, Math.min(C.player.maxHp, v));
  const delta = p.hp - nv;
  p.hp = nv;
  if (nv <= 0 && p.alive) eliminate(g, p);
  return delta;
}
function damage(g, p, amount, byId = null) {
  const eff = p.cover ? amount * C.throw.coverDamageMul : amount;
  const before = p.hp;
  setHp(g, p, p.hp - eff);
  g.stats.totalDamage += before - p.hp;
  return before - p.hp;
}
function addSnowballs(p, n) { p.snowballs = Math.max(0, p.snowballs + n); return p.snowballs; }

function eliminate(g, p) {
  if (!p.alive) return;
  p.alive = false; p.crafting = false;
  g.placementOrder.push(p.id);
  g.events.push({ t: g.t, type: 'eliminate', id: p.id, isNpc: p.isNpc, place: aliveCount(g) + 1 });
  checkWin(g);
}

function aliveCount(g) { return g.players.filter((p) => p.alive).length; }
function humanPlayer(g) { return g.players.find((p) => p.id === g._humanId); }

function checkWin(g) {
  const alive = g.players.filter((p) => p.alive);
  if (alive.length <= 1) {
    g.phase = 'over'; g.over = true;
    g.winner = alive[0] || null;
    if (g.winner) g.placementOrder.push(g.winner.id);
    const human = humanPlayer(g);
    g.won = !!(g.winner && human && g.winner.id === human.id);
    g.events.push({ t: g.t, type: 'gameover', winnerId: g.winner ? g.winner.id : null, humanWon: g.won });
  }
}

// ---- crafting ------------------------------------------------------------
function nearestPile(g, p, range = C.craft.interactRange) {
  let best = null, bd = range;
  for (const pile of g.piles) {
    if (pile.cooldownUntil > g.t) continue;
    const d = Math.hypot(pile.x - p.x, pile.y - p.y);
    if (d <= bd) { bd = d; best = pile; }
  }
  return best;
}

function startCraft(g, p) {
  if (!p.alive || p.crafting) return false;
  const pile = nearestPile(g, p);
  if (!pile) return false;
  p.crafting = true; p.craftTimer = C.craft.seconds; p.craftPile = pile.id;
  g.stats.craftAttempts++;
  g.events.push({ t: g.t, type: 'craftStart', id: p.id });
  return true;
}

function cancelCraft(g, p, reason = 'move') {
  if (!p.crafting) return;
  p.crafting = false; p.craftTimer = 0; p.craftPile = null;
  g.stats.craftCancel++;
  g.events.push({ t: g.t, type: 'craftCancel', id: p.id, reason });
}

function finishCraft(g, p) {
  addSnowballs(p, C.craft.yield);
  const pile = g.piles.find((pl) => pl.id === p.craftPile);
  if (pile) pile.cooldownUntil = g.t + C.map.pileCooldown;
  p.crafting = false; p.craftTimer = 0; p.craftPile = null;
  g.stats.craftDone++;
  g.events.push({ t: g.t, type: 'craftDone', id: p.id });
}

// ---- throwing ------------------------------------------------------------
// charge 0..1 -> range. Returns snowball or null.
function throwSnowball(g, p, aim, charge01) {
  if (!p.alive || p.crafting || p.snowballs <= 0) return null;
  addSnowballs(p, -1);
  const range = C.throw.minRange + (C.throw.maxRange - C.throw.minRange) * Math.max(0, Math.min(1, charge01));
  const sb = {
    id: uid(), ownerId: p.id, isNpc: p.isNpc,
    x: p.x, y: p.y, dirX: Math.cos(aim), dirY: Math.sin(aim),
    traveled: 0, range, speed: C.throw.speed, dead: false,
  };
  g.snowballs.push(sb);
  g.stats.throws++;
  g.events.push({ t: g.t, type: 'throw', id: p.id, charge: charge01 });
  return sb;
}

// charge from held ms
function chargeFromMs(ms) {
  const clamped = Math.max(C.throw.minChargeMs, Math.min(C.throw.maxChargeMs, ms));
  return (clamped - C.throw.minChargeMs) / (C.throw.maxChargeMs - C.throw.minChargeMs);
}
function rangeForCharge(charge01) {
  return C.throw.minRange + (C.throw.maxRange - C.throw.minRange) * Math.max(0, Math.min(1, charge01));
}

// ---- walls & decoys ------------------------------------------------------
function buildWall(g, p) {
  if (!p.alive || p.crafting || p.snowballs < C.wall.cost || p.walls >= C.wall.maxPerPlayer) return null;
  addSnowballs(p, -C.wall.cost);
  const wx = p.x + Math.cos(p.aim) * C.wall.dist;
  const wy = p.y + Math.sin(p.aim) * C.wall.dist;
  const wall = { id: uid(), ownerId: p.id, x: wx, y: wy, angle: p.aim + Math.PI / 2, hp: C.wall.durability, decayAt: g.t + C.wall.decaySec };
  g.walls.push(wall); p.walls++;
  g.stats.wallsBuilt++;
  g.events.push({ t: g.t, type: 'wall', id: p.id });
  return wall;
}

function placeDecoy(g, p) {
  if (!p.alive || p.crafting || p.snowballs < C.decoy.cost || p.decoys >= C.decoy.maxPerPlayer) return null;
  addSnowballs(p, -C.decoy.cost);
  const dx = p.x + Math.cos(p.aim) * C.decoy.dist;
  const dy = p.y + Math.sin(p.aim) * C.decoy.dist;
  const decoy = { id: uid(), ownerId: p.id, x: dx, y: dy, until: g.t + C.decoy.lureSec, alive: true };
  g.decoys.push(decoy); p.decoys++;
  g.stats.decoys++;
  g.events.push({ t: g.t, type: 'decoy', id: p.id });
  return decoy;
}

// segment-point distance for wall blocking
function wallBlocks(wall, x0, y0, x1, y1) {
  // treat wall as a segment centered at (x,y) length wall.len along angle
  const half = C.wall.len / 2;
  const ax = wall.x + Math.cos(wall.angle) * half, ay = wall.y + Math.sin(wall.angle) * half;
  const bx = wall.x - Math.cos(wall.angle) * half, by = wall.y - Math.sin(wall.angle) * half;
  return segIntersect(x0, y0, x1, y1, ax, ay, bx, by);
}
function segIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
  const d = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3);
  if (Math.abs(d) < 1e-9) return false;
  const t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / d;
  const u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// ---- simulation step -----------------------------------------------------
function step(g, dt) {
  if (g.over) return;
  g.t += dt;

  // zone shrink
  if (g.t >= g.zone.nextShrink && g.zone.radius > C.zone.finalRadius) {
    g.zone.radius = Math.max(C.zone.finalRadius, g.zone.radius * (1 - C.zone.shrinkStep * 0.5));
    g.zone.nextShrink = g.t + C.zone.intervalSec;
    g.zone.shrinks++;
    g.events.push({ t: g.t, type: 'zoneShrink', radius: g.zone.radius });
  }

  // players
  for (const p of g.players) {
    if (!p.alive) continue;
    // crafting countdown
    if (p.crafting) {
      p.craftTimer -= dt;
      if (p.craftTimer <= 0) finishCraft(g, p);
    }
    // NPC brain
    if (p.isNpc) npcThink(g, p, dt);
    // zone damage
    const distFromCenter = Math.hypot(p.x - g.zone.cx, p.y - g.zone.cy);
    if (distFromCenter > g.zone.radius) {
      const dmg = C.zone.dps * dt;
      const before = p.hp;
      setHp(g, p, p.hp - dmg);
      g.stats.zoneDamageTicks++;
      g.stats.zoneDamageTotal += before - p.hp;
    }
    // decay walls owned counts recomputed below
  }

  // snowballs travel + collision
  for (const sb of g.snowballs) {
    if (sb.dead) continue;
    const stepDist = sb.speed * dt;
    const nx = sb.x + sb.dirX * stepDist, ny = sb.y + sb.dirY * stepDist;
    // wall collision — a low (1.2m) wall blocks most but not all shots; a
    // fraction arc over it, so pure turtling can still be punished.
    let blocked = false;
    for (const w of g.walls) {
      if (w.ownerId === sb.ownerId) continue;
      if (wallBlocks(w, sb.x, sb.y, nx, ny)) {
        if (g.rng() < C.wall.blockChance) { w.hp--; blocked = true; if (w.hp <= 0) w.dead = true; }
        break;
      }
    }
    if (blocked) { sb.dead = true; continue; }
    // decoy collision (lures/destroys)
    let hitDecoy = false;
    for (const d of g.decoys) {
      if (!d.alive || d.ownerId === sb.ownerId) continue;
      if (Math.hypot(d.x - nx, d.y - ny) < 14) { d.alive = false; hitDecoy = true; break; }
    }
    if (hitDecoy) { sb.dead = true; continue; }
    // player collision
    for (const p of g.players) {
      if (!p.alive || p.id === sb.ownerId) continue;
      if (Math.hypot(p.x - nx, p.y - ny) < C.player.radius + C.throw.radius) {
        const dealt = damage(g, p, C.throw.damage, sb.ownerId);
        if (dealt > 0) { g.stats.hits++; g.kills[sb.ownerId] = (g.kills[sb.ownerId] || 0); }
        if (p.crafting) cancelCraft(g, p, 'hit');
        if (!p.alive) { g.kills[sb.ownerId] = (g.kills[sb.ownerId] || 0) + 1; g.events.push({ t: g.t, type: 'kill', by: sb.ownerId, victim: p.id }); }
        sb.dead = true;
        break;
      }
    }
    sb.x = nx; sb.y = ny; sb.traveled += stepDist;
    if (sb.traveled >= sb.range) sb.dead = true;
  }
  g.snowballs = g.snowballs.filter((s) => !s.dead);

  // cleanup walls (durability, decay, out-of-zone)
  for (const w of g.walls) {
    if (w.dead) continue;
    if (g.t >= w.decayAt) w.dead = true;
  }
  g.walls = g.walls.filter((w) => !w.dead);
  g.decoys = g.decoys.filter((d) => d.alive && d.until > g.t - 0.001 ? true : (d.until > g.t));
  g.decoys = g.decoys.filter((d) => d.alive && d.until > g.t);

  // recompute per-player wall/decoy counts
  const wc = {}, dc = {};
  for (const w of g.walls) wc[w.ownerId] = (wc[w.ownerId] || 0) + 1;
  for (const d of g.decoys) dc[d.ownerId] = (dc[d.ownerId] || 0) + 1;
  for (const p of g.players) { p.walls = wc[p.id] || 0; p.decoys = dc[p.id] || 0; }

  if (g.phase === 'drop' && g.t > 0) g.phase = 'play';
}

// ---- player movement (called by input/NPC) ------------------------------
function movePlayer(g, p, mvx, mvy, dt) {
  if (!p.alive || p.crafting) return;
  const spd = C.player.speed * (p.cover ? C.player.coverSpeedMul : 1) * dt;
  const len = Math.hypot(mvx, mvy) || 1;
  p.x = Math.max(0, Math.min(C.map.size, p.x + (mvx / len) * spd));
  p.y = Math.max(0, Math.min(C.map.size, p.y + (mvy / len) * spd));
}

// ---- NPC AI state machine ------------------------------------------------
// PATROL -> SEEK_PILE -> CRAFT -> ATTACK -> RETREAT -> ZONE_MOVE
function npcThink(g, p, dt) {
  const diff = C.npcDifficulty[p.diff] || C.npcDifficulty.normal;
  const ai = p.npc;
  ai.reactTimer -= dt;

  // zone safety first
  const distCenter = Math.hypot(p.x - g.zone.cx, p.y - g.zone.cy);
  if (distCenter > g.zone.radius * 0.97) {
    if (p.crafting) cancelCraft(g, p, 'zone');
    const ang = Math.atan2(g.zone.cy - p.y, g.zone.cx - p.x);
    movePlayer(g, p, Math.cos(ang), Math.sin(ang), dt);
    ai.state = 'ZONE_MOVE';
    return;
  }

  // warmup: no attacking human in first warmupSec
  const canAttackHuman = g.t >= C.match.warmupSec;

  // if crafting, just wait
  if (p.crafting) return;

  // find target enemy (nearest alive other, prefer decoys as lure)
  let target = null, td = Infinity;
  for (const d of g.decoys) {
    if (!d.alive || d.ownerId === p.id) continue;
    const dd = Math.hypot(d.x - p.x, d.y - p.y);
    if (dd < td && dd < C.throw.maxRange) { td = dd; target = { x: d.x, y: d.y, decoy: true }; }
  }
  if (!target) {
    for (const o of g.players) {
      if (!o.alive || o.id === p.id) continue;
      if (o.isHuman && !canAttackHuman) continue;
      const dd = Math.hypot(o.x - p.x, o.y - p.y);
      if (dd < td) { td = dd; target = { x: o.x, y: o.y, ref: o }; }
    }
  }

  // low/no ammo -> flee from a nearby threat first, else craft/seek pile.
  if (p.snowballs < diff.craftThreshold) {
    if (target && td < C.match.fleeRange) {
      // disengage: run away from threat (reduces early bloodbath & lengthens matches)
      const a = Math.atan2(p.y - target.y, p.x - target.x);
      movePlayer(g, p, Math.cos(a), Math.sin(a), dt); ai.state = 'RETREAT'; return;
    }
    const pile = nearestPile(g, p);
    if (pile) { startCraft(g, p); ai.state = 'CRAFT'; return; }
    const sp = seekPile(g, p);
    if (sp) { const a = Math.atan2(sp.y - p.y, sp.x - p.x); movePlayer(g, p, Math.cos(a), Math.sin(a), dt); ai.state = 'SEEK_PILE'; return; }
  }

  // engage target — only within the tighter engageRange (not full throw range),
  // so NPCs don't snipe across the whole map at the start (paces the match).
  if (target && td < C.match.engageRange && p.snowballs > 0) {
    const a = Math.atan2(target.y - p.y, target.x - p.x);
    p.aim = a;
    if (ai.reactTimer <= 0 && g.rng() < diff.aggro) {
      // accuracy: perturb aim by error inversely to accuracy
      const err = (1 - diff.accuracy) * 0.5;
      const aimErr = g.rng.range(-err, err);
      const charge = Math.min(1, td / C.throw.maxRange);
      throwSnowball(g, p, a + aimErr, charge);
      ai.reactTimer = diff.reactSec;
    }
    // keep some distance: back off if too close, hold if mid-range
    if (td < C.match.engageRange * 0.4) movePlayer(g, p, -Math.cos(a), -Math.sin(a), dt);
    ai.state = 'ATTACK';
    return;
  }

  // patrol toward center-ish / wander
  if (!ai.moveTx || Math.hypot(ai.moveTx - p.x, ai.moveTy - p.y) < 20) {
    ai.moveTx = g.rng.range(0, C.map.size); ai.moveTy = g.rng.range(0, C.map.size);
  }
  const a = Math.atan2(ai.moveTy - p.y, ai.moveTx - p.x);
  movePlayer(g, p, Math.cos(a), Math.sin(a), dt);
  ai.state = 'PATROL';
}

function seekPile(g, p) {
  let best = null, bd = Infinity;
  for (const pile of g.piles) {
    if (pile.cooldownUntil > g.t) continue;
    const d = Math.hypot(pile.x - p.x, pile.y - p.y);
    if (d < bd) { bd = d; best = pile; }
  }
  return best;
}

// ---- result / grade ------------------------------------------------------
function humanPlacement(g) {
  const human = humanPlayer(g);
  if (!human) return null;
  // placementOrder is elimination order (first out = last place). winner appended last.
  const idx = g.placementOrder.indexOf(human.id);
  if (idx < 0) return null;
  return g.players.length - idx; // 1 = winner
}

function result(g) {
  const human = humanPlayer(g);
  const place = humanPlacement(g);
  return {
    won: g.won,
    place,
    total: g.players.length,
    kills: human ? (g.kills[human.id] || 0) : 0,
    survivedSec: g.t,
    stats: g.stats,
  };
}

// ---- save / load ---------------------------------------------------------
function serialize(g) {
  return JSON.stringify({
    seed: g.seed, t: g.t, phase: g.phase, over: g.over, won: g.won,
    difficulty: g.difficulty,
    players: g.players, snowballs: g.snowballs, walls: g.walls, decoys: g.decoys,
    piles: g.piles, zone: g.zone, placementOrder: g.placementOrder, kills: g.kills,
    _humanId: g._humanId, stats: g.stats,
  });
}
function deserialize(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  const g = { rng: makeRng(d.seed), events: [] };
  Object.assign(g, d);
  return g;
}



/* ===== app.js ===== */
// Snow Royale browser app — TRUE FIRST-PERSON renderer (서든어택/배틀그라운드 스타일).
// Pointer-lock mouse-look, perspective ground-plane projection with billboarded
// sprites, fog, crosshair + charge meter, first-person view model. The engine
// stays the same 2D simulation; this layer projects it into an FPS camera.



const ASSET = 'assets/';
const CHAR_FILES = { jack: 'char_jack.webp', white: 'char_white.webp', bear: 'char_bear.webp', bot: 'char_bot.webp' };
const BG_FILES = { plains: 'bg_plains.webp', village: 'bg_village.webp', lake: 'bg_lake.webp', lobby: 'bg_lobby.webp' };
const SAVE_KEY = 'snow_royale_save_v1';

// world scale: 1200u map ≈ 100m → eye height ~1.7m ≈ 20u, character ~2m ≈ 26u
const EYE = 20;
const CHAR_H = 30;
const FOG_START = 260, FOG_END = 620;

class SnowApp {
  constructor(root, { seed = null, timeScale = 1, autoStart = true } = {}) {
    this.root = root;
    this.seed = seed;
    this.timeScale = timeScale;
    this.audio = new AudioEngine();
    this.images = {};
    this.scene = 'title';
    this.keys = {};
    this.mouse = { down: false, downAt: 0 };
    this.yaw = 0; this.pitch = 0;
    this.locked = false;
    this.bobT = 0;
    this.hitMarkerUntil = 0;
    this.damageFlashUntil = 0;
    this.killFeed = [];
    this.dropTarget = null;
    this._build();
    if (autoStart) this._loadAssets().then(() => this._showTitle());
  }

  _build() {
    this.root.innerHTML = '';
    this.root.className = 'sr-root';
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'sr-canvas';
    this.root.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.overlay = document.createElement('div');
    this.overlay.className = 'sr-overlay';
    this.root.appendChild(this.overlay);
    this.hud = document.createElement('div');
    this.hud.className = 'sr-hud';
    this.hud.style.display = 'none';
    this.root.appendChild(this.hud);
    this._resize();
    window.addEventListener('resize', () => this._resize());
    this._bindInput();
    this._loop();
  }

  _resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = this.root.clientWidth || 960, h = this.root.clientHeight || 600;
    this.canvas.width = w * dpr; this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.vw = w; this.vh = h;
    this.focal = (w / 2); // 90° horizontal FOV
  }

  async _loadAssets() {
    const load = (key, file) => new Promise((res) => {
      const img = new Image();
      img.onload = () => { this.images[key] = img; res(true); };
      img.onerror = () => { this.images[key] = null; res(false); };
      img.src = ASSET + file;
    });
    const jobs = [];
    for (const [k, f] of Object.entries(CHAR_FILES)) jobs.push(load(k, f));
    for (const [k, f] of Object.entries(BG_FILES)) jobs.push(load('bg_' + k, f));
    await Promise.all(jobs);
    this.assetsLoaded = true;
  }

  // ---- scenes --------------------------------------------------------------
  _showTitle() {
    this.scene = 'title'; this.hud.style.display = 'none';
    if (document.pointerLockElement) document.exitPointerLock();
    const c = document.createElement('div'); c.className = 'sr-title';
    const h = document.createElement('h1'); h.textContent = '스노우 로얄';
    const sub = document.createElement('p'); sub.className = 'sr-sub'; sub.textContent = 'Snow Royale — 1인칭 눈싸움 배틀로얄 · 3초의 침묵이 설원의 왕을 결정한다';
    c.appendChild(h); c.appendChild(sub);
    const diffRow = document.createElement('div'); diffRow.className = 'sr-diffrow';
    this._difficulty = this._difficulty || 'normal';
    for (const [k, label] of [['easy', '쉬움'], ['normal', '보통'], ['hard', '어려움']]) {
      const b = document.createElement('button'); b.className = 'sr-diff' + (this._difficulty === k ? ' on' : ''); b.textContent = label;
      b.addEventListener('click', () => { this._difficulty = k; this._showTitle(); });
      diffRow.appendChild(b);
    }
    c.appendChild(diffRow);
    const start = this._btn('낙하 시작', () => this.newGame(), true); c.appendChild(start);
    c.appendChild(this._btn('❓ 조작법', () => this._showHelp()));
    const mute = this._btn(this.audio.muted ? '🔇 사운드' : '🔊 사운드', () => { this.audio.setMuted(!this.audio.muted); mute.textContent = this.audio.muted ? '🔇 사운드' : '🔊 사운드'; });
    c.appendChild(mute);
    const foot = document.createElement('p'); foot.className = 'sr-foot';
    foot.textContent = '1인칭 FPS · 화면 클릭=조준 잠금(ESC 해제) · WASD 이동 · 마우스 시점 · 좌클릭 홀드→놓기 투척 · E 제작 · Q 설벽 · F 미끼 · C 엄폐 · M 지도';
    c.appendChild(foot);
    this.overlay.innerHTML = ''; this.overlay.appendChild(c); this.overlay.style.display = 'flex';
  }

  _showHelp() {
    const ov = document.createElement('div'); ov.className = 'sr-modal';
    const box = document.createElement('div'); box.className = 'sr-modal-box';
    const h = document.createElement('h2'); h.textContent = '조작법 (FPS)';
    box.appendChild(h);
    const lines = [
      '🖱 화면 클릭 — 마우스 조준 잠금 시작 (ESC로 해제)',
      '마우스 이동 — 시점 회전(마우스룩), 화면 중앙 십자선으로 조준',
      'W A S D — 보는 방향 기준 전진/좌/후진/우 이동',
      '좌클릭 홀드 → 놓기 — 눈뭉치 투척 (오래 누를수록 멀리, 십자선 아래 차지 게이지)',
      'E — 눈더미 근처에서 3초 제작 (+10, 도중 이동/피격 시 취소, 완전 무방비!)',
      'Q — 설벽 건설 (눈뭉치 4개) · F — 눈사람 미끼 (5개) · C — 엄폐(피해 절반)',
      'M — 전장 지도 · Tab 유지 없음 · 피격 시 화면 가장자리 빨간 플래시',
      '적을 맞히면 십자선에 히트마커(✕)가 번쩍입니다',
    ];
    lines.forEach((t) => { const p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
    box.appendChild(this._btn('닫기', () => ov.remove(), true));
    ov.appendChild(box); this.root.appendChild(ov);
  }

  newGame(seed = this.seed) {
    this.audio.init(); this.audio.resume();
    const s = seed != null ? seed : (Math.floor(performance.now()) % 100000) + 1;
    this.game = E.createGame(s, { total: C.match.total, difficulty: this._difficulty || 'normal' });
    this.human = E.humanPlayer(this.game);
    this.scene = 'drop';
    this.dropT = 0;
    this.dropTarget = { x: this.game.zone.cx + this.game.rng.range(-300, 300), y: this.game.zone.cy + this.game.rng.range(-300, 300) };
    this.yaw = 0; this.pitch = 0;
    this.killFeed = [];
    this.overlay.style.display = 'none'; this.overlay.innerHTML = '';
    this.hud.style.display = 'block';
    this._lastSurvivors = C.match.total;
    this._toast('낙하 지점을 클릭해 조준하세요 — 착지 후 화면을 클릭하면 FPS 조준이 잠깁니다');
  }

  _enterPlay() {
    this.scene = 'play';
    if (this.dropTarget) { this.human.x = this.dropTarget.x; this.human.y = this.dropTarget.y; }
    // face zone center on landing
    this.yaw = Math.atan2(this.game.zone.cy - this.human.y, this.game.zone.cx - this.human.x);
    this.audio.landing();
    this._toast('화면을 클릭해 조준을 잠그세요 (ESC로 해제)');
  }

  _showResult() {
    this.scene = 'result'; this.hud.style.display = 'none';
    if (document.pointerLockElement) document.exitPointerLock();
    const r = E.result(this.game);
    if (r.won) this.audio.fanfare(); else this.audio.gameover();
    this.audio.stopAll();
    const c = document.createElement('div'); c.className = 'sr-result ' + (r.won ? 'sr-win' : 'sr-lose');
    const big = document.createElement('div'); big.className = 'sr-place';
    big.textContent = r.won ? '🏆' : `#${r.place}`;
    const h = document.createElement('h2'); h.textContent = r.won ? '설원의 왕!' : '탈락';
    const stat = document.createElement('div'); stat.className = 'sr-rstats';
    stat.appendChild(this._stat('순위', `${r.place}/${r.total}`));
    stat.appendChild(this._stat('처치', r.kills));
    stat.appendChild(this._stat('생존', `${Math.floor(r.survivedSec / 60)}:${String(Math.floor(r.survivedSec % 60)).padStart(2, '0')}`));
    c.appendChild(big); c.appendChild(h); c.appendChild(stat);
    const cause = document.createElement('p'); cause.className = 'sr-sub';
    cause.textContent = r.won ? '마지막까지 맞지 않았습니다.' : (this._humanLastCause || '눈뭉치에 맞아 탈락했습니다.');
    c.appendChild(cause);
    const retry = this._btn('다시 도전 (Space)', () => this.newGame(), true); c.appendChild(retry);
    c.appendChild(this._btn('타이틀로', () => this._showTitle()));
    this.overlay.innerHTML = ''; this.overlay.appendChild(c); this.overlay.style.display = 'flex';
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ lastPlace: r.place, won: r.won })); } catch { /* ignore */ }
  }

  // ---- input (pointer lock FPS) ---------------------------------------------
  _bindInput() {
    // Use e.code (physical key) — e.key breaks under Korean/other IME because
    // KeyW arrives as 'ㅈ'. e.code is layout/IME independent.
    window.addEventListener('keydown', (e) => {
      this.keys[e.code] = true;
      if (e.code === 'Space' && this.scene === 'result') { e.preventDefault(); this.newGame(); }
      if (this.scene === 'play') {
        if (e.code === 'KeyE') this._tryCraft();
        if (e.code === 'KeyQ') this._act('wall');
        if (e.code === 'KeyF') this._act('decoy');
        if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) e.preventDefault();
      }
      if (e.code === 'KeyM') this._showMinimap = !this._showMinimap;
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.mouse.down = false; });

    // pointer lock lifecycle
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === this.canvas;
      if (!this.locked && this.scene === 'play') this._toast('조준 잠금 해제됨 — 화면을 클릭해 다시 잠그세요');
    });
    document.addEventListener('mousemove', (e) => {
      if (!this.locked || this.scene !== 'play') return;
      const sens = 0.0026;
      this.yaw += e.movementX * sens;
      this.pitch = Math.max(-0.6, Math.min(0.5, this.pitch + e.movementY * sens * 0.8));
    });

    const rect = () => this.canvas.getBoundingClientRect();
    this.canvas.addEventListener('mousedown', (e) => {
      this.audio.resume();
      if (this.scene === 'drop') {
        const r = rect();
        const w = this._dropScreenToWorld(e.clientX - r.left, e.clientY - r.top);
        if (w) this.dropTarget = w;
        return;
      }
      if (this.scene === 'play') {
        if (!this.locked) {
          const p = this.canvas.requestPointerLock && this.canvas.requestPointerLock({ unadjustedMovement: true });
          if (p && p.catch) p.catch(() => this.canvas.requestPointerLock());
          return; // first click locks; next clicks throw
        }
        this.mouse.down = true; this.mouse.downAt = performance.now();
      }
    });
    this.canvas.addEventListener('mouseup', () => {
      if (this.scene === 'play' && this.locked && this.mouse.down) {
        this._throw(performance.now() - this.mouse.downAt);
        this.mouse.down = false;
      }
    });
    // touch fallback: hold to charge & throw toward screen center
    this.canvas.addEventListener('touchstart', (e) => { this.audio.resume(); if (this.scene === 'play') { this.mouse.down = true; this.mouse.downAt = performance.now(); } e.preventDefault(); }, { passive: false });
    this.canvas.addEventListener('touchend', (e) => { if (this.scene === 'play' && this.mouse.down) { this._throw(performance.now() - this.mouse.downAt); this.mouse.down = false; } e.preventDefault(); }, { passive: false });
  }

  _dropScreenToWorld(sx, sy) {
    // drop phase uses top-down map view
    const zoom = Math.min(this.vw, this.vh) / (C.map.size * 1.05);
    const ox = this.vw / 2 - this.game.zone.cx * zoom, oy = this.vh / 2 - this.game.zone.cy * zoom;
    return { x: (sx - ox) / zoom, y: (sy - oy) / zoom };
  }

  _tryCraft() {
    if (!this.human.alive || this.human.crafting) return;
    if (E.startCraft(this.game, this.human)) this.audio.craftStart();
    else this._toast('근처에 눈더미가 없습니다 — 지도(M)에서 흰 점을 찾으세요');
  }
  _throw(heldMs) {
    if (!this.human.alive || this.human.crafting) return;
    if (this.human.snowballs <= 0) { this._toast('눈뭉치 없음 — 눈더미에서 E로 제작하세요'); return; }
    const charge = E.chargeFromMs(heldMs);
    E.throwSnowball(this.game, this.human, this.yaw, charge);
    this.audio.throw();
    this.viewKick = 1; // view model throw animation
  }
  _act(kind) {
    if (!this.human.alive || this.human.crafting) return;
    this.human.aim = this.yaw;
    if (kind === 'wall') { if (E.buildWall(this.game, this.human)) this.audio.wall(); else this._toast(`설벽: 눈뭉치 ${C.wall.cost}개 필요 (최대 ${C.wall.maxPerPlayer})`); }
    if (kind === 'decoy') { if (E.placeDecoy(this.game, this.human)) this.audio.decoy(); else this._toast(`미끼: 눈뭉치 ${C.decoy.cost}개 필요 (최대 ${C.decoy.maxPerPlayer})`); }
  }

  // ---- update --------------------------------------------------------------
  _update(dt) {
    if (!this.game) return;
    if (this.scene === 'drop') {
      this.dropT += dt;
      if (this.dropT >= 8) this._enterPlay(); // shorter drop for pace
      return;
    }
    if (this.scene !== 'play') return;
    const g = this.game, h = this.human;
    h.aim = this.yaw;
    // view-relative WASD
    if (h.alive && !h.crafting) {
      let f = 0, r = 0;
      if (this.keys['KeyW'] || this.keys['ArrowUp']) f += 1;
      if (this.keys['KeyS'] || this.keys['ArrowDown']) f -= 1;
      if (this.keys['KeyD'] || this.keys['ArrowRight']) r += 1;
      if (this.keys['KeyA'] || this.keys['ArrowLeft']) r -= 1;
      h.cover = !!this.keys['KeyC'];
      if (f || r) {
        const cos = Math.cos(this.yaw), sin = Math.sin(this.yaw);
        const mvx = cos * f + (-sin) * r * -1; // right = (−sin? see note) — derive: right vector = (−sinθ, cosθ)... careful below
        // forward = (cosθ, sinθ); right = (cos(θ+π/2), sin(θ+π/2)) = (−sinθ, cosθ)
        const mx = cos * f + (-sin) * r;
        const my = sin * f + (cos) * r;
        E.movePlayer(g, h, mx, my, dt);
        this.bobT += dt * 9;
      }
    }
    const beforeHp = h.hp, beforeCraft = h.crafting, beforeAlive = h.alive;
    const killsBefore = g.kills[h.id] || 0;
    const hitsBefore = g.stats.hits;
    if (h.crafting) { this._craftBeat = (this._craftBeat || 0) + dt; if (this._craftBeat > 0.5) { this._craftBeat = 0; this.audio.craftTick(); } }
    E.step(g, dt);
    // feedback
    if (h.hp < beforeHp) { this.audio.hit(); this.damageFlashUntil = performance.now() + 250; }
    if ((g.kills[h.id] || 0) > killsBefore) { this.hitMarkerUntil = performance.now() + 400; }
    else if (g.stats.hits > hitsBefore) {
      // any hit this tick; if one of our snowballs vanished into a player near our aim, flash marker (approx)
      this.hitMarkerUntil = Math.max(this.hitMarkerUntil, performance.now() + 220);
    }
    if (beforeAlive && !h.alive) this._humanLastCause = '눈뭉치에 맞아 탈락했습니다.';
    // kill feed
    for (const e of g.events.splice(0).filter((ev) => ev.type === 'kill' || ev.type === 'eliminate')) {
      if (e.type === 'kill') {
        const by = g.players.find((p) => p.id === e.by), v = g.players.find((p) => p.id === e.victim);
        if (by && v) this.killFeed.push({ text: `${by.name} ❄→ ${v.name}`, until: performance.now() + 4200 });
      }
    }
    if (this.killFeed.length > 5) this.killFeed = this.killFeed.slice(-5);
    const surv = E.aliveCount(g);
    if (surv !== this._lastSurvivors) { this.audio.setIntensity(surv); this._lastSurvivors = surv; }
    if (g.zone.shrinks !== this._lastShrinks) { this._lastShrinks = g.zone.shrinks; this.audio.zoneWarn(); this._toast('⚠ 눈보라 구역이 좁아집니다!'); }
    if (beforeCraft && !h.crafting && h.craftTimer <= 0 && h.alive) this.audio.craftDone();
    if (this.viewKick > 0) this.viewKick = Math.max(0, this.viewKick - dt * 4);
    if (g.over) this._showResult();
  }

  // ---- FPS render ------------------------------------------------------------
  _loop() {
    let last = performance.now();
    const frame = (now) => {
      let dt = (now - last) / 1000; last = now;
      dt = Math.min(0.05, dt) * this.timeScale;
      if (this.game && (this.scene === 'play' || this.scene === 'drop')) this._update(dt);
      if (this.game) {
        if (this.scene === 'drop') this._renderDrop();
        else this._renderFps(now);
        this._renderHud();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // top-down map for the parachute phase (aim your landing)
  _renderDrop() {
    const ctx = this.ctx, g = this.game;
    const zoom = Math.min(this.vw, this.vh) / (C.map.size * 1.05);
    const ox = this.vw / 2 - g.zone.cx * zoom, oy = this.vh / 2 - g.zone.cy * zoom;
    const bg = this.images.bg_lobby;
    ctx.clearRect(0, 0, this.vw, this.vh);
    if (bg) { ctx.drawImage(bg, 0, 0, this.vw, this.vh); ctx.fillStyle = 'rgba(20,35,60,0.35)'; ctx.fillRect(0, 0, this.vw, this.vh); }
    else { ctx.fillStyle = '#22344f'; ctx.fillRect(0, 0, this.vw, this.vh); }
    // map frame
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.strokeRect(ox, oy, C.map.size * zoom, C.map.size * zoom);
    // zone
    ctx.beginPath(); ctx.arc(g.zone.cx * zoom + ox, g.zone.cy * zoom + oy, g.zone.radius * zoom, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    // piles
    for (const p of g.piles) { ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(p.x * zoom + ox, p.y * zoom + oy, 3, 0, Math.PI * 2); ctx.fill(); }
    // others dropping
    for (const p of this.game.players) { if (p.isNpc) { ctx.fillStyle = 'rgba(158,158,158,0.9)'; ctx.beginPath(); ctx.arc(p.x * zoom + ox, p.y * zoom + oy, 2.5, 0, Math.PI * 2); ctx.fill(); } }
    // target
    if (this.dropTarget) {
      const tx = this.dropTarget.x * zoom + ox, ty = this.dropTarget.y * zoom + oy;
      ctx.strokeStyle = '#FF6B35'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(tx, ty, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx - 22, ty); ctx.lineTo(tx + 22, ty); ctx.moveTo(tx, ty - 22); ctx.lineTo(tx, ty + 22); ctx.stroke();
    }
  }

  _project(wx, wy, z = 0) {
    const h = this.human;
    const dx = wx - h.x, dy = wy - h.y;
    const cos = Math.cos(this.yaw), sin = Math.sin(this.yaw);
    const camf = dx * cos + dy * sin;          // forward depth
    const camr = -dx * sin + dy * cos;         // right offset
    if (camf < 4) return null;
    const sx = this.vw / 2 + (camr / camf) * this.focal;
    const horizon = this._horizonY();
    const sy = horizon + ((EYE - z) / camf) * this.focal;
    return { sx, sy, depth: camf, scale: this.focal / camf };
  }
  _horizonY() {
    const bob = Math.sin(this.bobT) * 3;
    return this.vh * 0.5 + this.pitch * this.vh * 0.7 + bob;
  }
  _fog(depth) { return Math.max(0, Math.min(1, (depth - FOG_START) / (FOG_END - FOG_START))); }

  _renderFps(now) {
    const ctx = this.ctx, g = this.game, h = this.human;
    const horizon = this._horizonY();

    // --- sky: panorama strip from bg image shifted by yaw (wraps) ---
    ctx.clearRect(0, 0, this.vw, this.vh);
    const pano = this.images.bg_plains;
    if (pano) {
      const pw = this.vw * 2.6; // stretch image over 360°/FOV span feel
      let off = (-(this.yaw / (Math.PI * 2)) * pw) % pw; if (off > 0) off -= pw;
      const skyH = Math.max(80, horizon);
      for (let x = off; x < this.vw; x += pw) ctx.drawImage(pano, x, horizon - skyH, pw, skyH);
      ctx.fillStyle = 'rgba(150,185,215,0.25)'; ctx.fillRect(0, 0, this.vw, Math.max(0, horizon));
    } else {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#9dbede'); sky.addColorStop(1, '#e8f2f8');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, this.vw, Math.max(0, horizon));
    }

    // --- ground: perspective snow gradient ---
    const grd = ctx.createLinearGradient(0, horizon, 0, this.vh);
    grd.addColorStop(0, '#cfe0ec'); grd.addColorStop(0.25, '#e9f2f7'); grd.addColorStop(1, '#fbfdff');
    ctx.fillStyle = grd; ctx.fillRect(0, Math.max(0, horizon), this.vw, this.vh - horizon);

    // ground speckle grid → strong motion/parallax cue
    ctx.fillStyle = 'rgba(140,170,195,0.5)';
    const GRID = 60;
    const gx0 = Math.floor((h.x - 700) / GRID) * GRID, gx1 = h.x + 700;
    const gy0 = Math.floor((h.y - 700) / GRID) * GRID, gy1 = h.y + 700;
    for (let wx = gx0; wx <= gx1; wx += GRID) {
      for (let wy = gy0; wy <= gy1; wy += GRID) {
        const p = this._project(wx, wy);
        if (!p || p.sy < horizon || p.sy > this.vh) continue;
        const r = Math.max(0.6, 2.6 * p.scale * 0.02);
        const a = 0.55 * (1 - this._fog(p.depth));
        if (a <= 0.02) continue;
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // --- blizzard zone wall (translucent vertical wall on the circle) ---
    this._renderZoneWall(ctx, horizon);

    // --- collect & depth-sort billboards ---
    const items = [];
    for (const pile of g.piles) {
      const p = this._project(pile.x, pile.y);
      if (p) items.push({ ...p, kind: 'pile', ref: pile });
    }
    for (const w of g.walls) { const p = this._project(w.x, w.y); if (p) items.push({ ...p, kind: 'wall', ref: w }); }
    for (const d of g.decoys) { const p = this._project(d.x, d.y); if (p) items.push({ ...p, kind: 'decoy', ref: d }); }
    for (const pl of g.players) {
      if (!pl.alive || pl.id === h.id) continue;
      const p = this._project(pl.x, pl.y);
      if (p) items.push({ ...p, kind: 'player', ref: pl });
    }
    for (const sb of g.snowballs) {
      const t = sb.range > 0 ? sb.traveled / sb.range : 0;
      const apex = Math.min(70, sb.range * 0.18);
      const z = Math.max(0, 4 * apex * t * (1 - t)) + 14;
      const p = this._project(sb.x, sb.y, z);
      if (p) items.push({ ...p, kind: 'snowball', ref: sb });
    }
    items.sort((a, b) => b.depth - a.depth);
    for (const it of items) this._drawBillboard(ctx, it, now);

    // --- snow particles drifting (screen-space ambience) ---
    this._renderSnowfall(ctx, now);

    // --- outside-zone tint ---
    const distC = Math.hypot(h.x - g.zone.cx, h.y - g.zone.cy);
    if (distC > g.zone.radius) {
      ctx.fillStyle = 'rgba(90,140,200,0.28)'; ctx.fillRect(0, 0, this.vw, this.vh);
    }

    // --- damage flash (red vignette) ---
    if (now < this.damageFlashUntil) {
      const gEdge = ctx.createRadialGradient(this.vw / 2, this.vh / 2, this.vh * 0.35, this.vw / 2, this.vh / 2, this.vh * 0.75);
      gEdge.addColorStop(0, 'rgba(220,20,60,0)'); gEdge.addColorStop(1, 'rgba(220,20,60,0.5)');
      ctx.fillStyle = gEdge; ctx.fillRect(0, 0, this.vw, this.vh);
    }

    // --- first-person view model (mitten + snowball) ---
    this._renderViewModel(ctx, now);

    // --- crosshair + charge + hit marker ---
    this._renderCrosshair(ctx, now);

    // pointer-lock prompt
    if (!this.locked && this.human.alive) {
      ctx.fillStyle = 'rgba(13,27,42,0.75)';
      const bw = 420, bh = 54;
      ctx.fillRect(this.vw / 2 - bw / 2, this.vh * 0.62, bw, bh);
      ctx.strokeStyle = '#FF6B35'; ctx.strokeRect(this.vw / 2 - bw / 2, this.vh * 0.62, bw, bh);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('🖱 화면을 클릭해 조준 잠금 (마우스로 시점 회전)', this.vw / 2, this.vh * 0.62 + 33);
    }
  }

  _renderZoneWall(ctx, horizon) {
    const g = this.game, h = this.human;
    const samples = 90;
    let prev = null;
    for (let i = 0; i <= samples; i++) {
      const a = (i / samples) * Math.PI * 2;
      const wx = g.zone.cx + Math.cos(a) * g.zone.radius;
      const wy = g.zone.cy + Math.sin(a) * g.zone.radius;
      const base = this._project(wx, wy, 0);
      const top = this._project(wx, wy, 90);
      if (base && top && prev && prev.base) {
        const fog = this._fog(base.depth);
        if (fog < 0.98) {
          ctx.fillStyle = `rgba(210,235,255,${0.34 * (1 - fog)})`;
          ctx.beginPath();
          ctx.moveTo(prev.base.sx, prev.base.sy); ctx.lineTo(base.sx, base.sy);
          ctx.lineTo(top.sx, top.sy); ctx.lineTo(prev.top.sx, prev.top.sy);
          ctx.closePath(); ctx.fill();
        }
      }
      prev = base && top ? { base, top } : null;
    }
  }

  _drawBillboard(ctx, it, now) {
    const fog = this._fog(it.depth);
    if (fog >= 0.99) return;
    const alpha = 1 - fog * 0.9;
    ctx.globalAlpha = alpha;
    if (it.kind === 'player') {
      const pl = it.ref;
      const sk = SKINS[pl.skin] || SKINS.bot;
      const img = this.images[pl.skin] || this.images.bot;
      const hpx = (CHAR_H / it.depth) * this.focal;
      const wpx = hpx * 0.62;
      // shadow
      ctx.fillStyle = `rgba(60,80,110,${0.25 * alpha})`;
      ctx.beginPath(); ctx.ellipse(it.sx, it.sy, wpx * 0.45, wpx * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      if (img) ctx.drawImage(img, it.sx - wpx / 2, it.sy - hpx, wpx, hpx);
      else { ctx.fillStyle = sk.color; ctx.fillRect(it.sx - wpx / 2, it.sy - hpx, wpx, hpx); }
      // name + hp bar (near only)
      if (it.depth < 320) {
        const bw = Math.max(30, wpx * 0.9);
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(it.sx - bw / 2, it.sy - hpx - 12, bw, 5);
        ctx.fillStyle = pl.hp > 50 ? '#7FFFD4' : '#DC143C';
        ctx.fillRect(it.sx - bw / 2, it.sy - hpx - 12, bw * (pl.hp / C.player.maxHp), 5);
        ctx.fillStyle = pl.isNpc ? '#cfd6dd' : '#fff';
        ctx.font = `bold ${Math.max(10, Math.min(14, hpx * 0.09))}px system-ui`; ctx.textAlign = 'center';
        ctx.fillText(pl.name, it.sx, it.sy - hpx - 17);
      }
    } else if (it.kind === 'pile') {
      const pile = it.ref;
      const onCd = pile.cooldownUntil > this.game.t;
      const hpx = (14 / it.depth) * this.focal;
      const wpx = hpx * 2.1;
      ctx.fillStyle = onCd ? `rgba(190,200,215,${alpha})` : `rgba(250,252,255,${alpha})`;
      ctx.strokeStyle = `rgba(150,185,210,${alpha})`;
      ctx.beginPath(); ctx.ellipse(it.sx, it.sy - hpx * 0.3, wpx / 2, hpx * 0.62, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // E prompt when near & available
      if (!onCd && it.depth < C.craft.interactRange + 22) {
        ctx.fillStyle = '#FF6B35'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('E — 눈뭉치 제작 (3초 무방비)', it.sx, it.sy - hpx - 10);
      }
    } else if (it.kind === 'wall') {
      const hpx = (26 / it.depth) * this.focal;
      const wpx = (C.wall.len / it.depth) * this.focal;
      ctx.fillStyle = `rgba(240,248,255,${alpha})`;
      ctx.strokeStyle = `rgba(140,175,205,${alpha})`;
      ctx.fillRect(it.sx - wpx / 2, it.sy - hpx, wpx, hpx);
      ctx.strokeRect(it.sx - wpx / 2, it.sy - hpx, wpx, hpx);
      // durability pips
      for (let i = 0; i < it.ref.hp; i++) { ctx.fillStyle = `rgba(255,107,53,${alpha})`; ctx.fillRect(it.sx - wpx / 2 + 3 + i * 7, it.sy - hpx + 3, 5, 3); }
    } else if (it.kind === 'decoy') {
      const hpx = (22 / it.depth) * this.focal;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(it.sx, it.sy - hpx * 0.25, hpx * 0.28, 0, Math.PI * 2); ctx.fill(); // body
      ctx.beginPath(); ctx.arc(it.sx, it.sy - hpx * 0.62, hpx * 0.2, 0, Math.PI * 2); ctx.fill(); // head
      ctx.fillStyle = `rgba(255,107,53,${alpha})`;
      ctx.beginPath(); ctx.arc(it.sx + hpx * 0.06, it.sy - hpx * 0.62, hpx * 0.045, 0, Math.PI * 2); ctx.fill(); // carrot
    } else if (it.kind === 'snowball') {
      if (it.depth < 16) { ctx.globalAlpha = 1; return; } // too close = just left the hand
      const r = Math.min(22, Math.max(3.5, (9 / it.depth) * this.focal));
      const sb = it.ref;
      // motion trail: project a point slightly behind along its path
      const bx = sb.x - sb.dirX * 26, by = sb.y - sb.dirY * 26;
      const t = sb.range > 0 ? sb.traveled / sb.range : 0;
      const apex = Math.min(70, sb.range * 0.18);
      const zNow = Math.max(0, 4 * apex * t * (1 - t)) + 14;
      const back = this._project(bx, by, zNow);
      if (back) {
        const grad = ctx.createLinearGradient(back.sx, back.sy, it.sx, it.sy);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(1, `rgba(255,255,255,${0.75 * alpha})`);
        ctx.strokeStyle = grad; ctx.lineWidth = Math.max(2, r * 0.8); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(back.sx, back.sy); ctx.lineTo(it.sx, it.sy); ctx.stroke();
        ctx.lineCap = 'butt';
      }
      // dark outline ring so it reads against white snow
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.strokeStyle = `rgba(50,80,120,${0.9 * alpha})`;
      ctx.lineWidth = 2;

var params = new URLSearchParams(location.search);
var seed = params.has('seed') ? parseInt(params.get('seed'),10) : null;
var app = new SnowApp(document.getElementById('game'), { seed: seed, autoStart: false });
window.__SR = app;
app._loadAssets = function(){
  var CHAR = { jack:'char_jack.webp', white:'char_white.webp', bear:'char_bear.webp', bot:'char_bot.webp' };
  var BG = { plains:'bg_plains.webp', village:'bg_village.webp', lake:'bg_lake.webp', lobby:'bg_lobby.webp' };
  var self = this; var jobs = [];
  function load(key, file){ return new Promise(function(res){ var img=new Image(); img.onload=function(){self.images[key]=img;res();}; img.onerror=function(){self.images[key]=null;res();}; img.src=__SNOW_ASSETS[file]||''; }); }
  for (var k in CHAR) jobs.push(load(k, CHAR[k]));
  for (var b in BG) jobs.push(load('bg_'+b, BG[b]));
  return Promise.all(jobs).then(function(){ self.assetsLoaded = true; });
};
app._loadAssets().then(function(){ app._showTitle(); });
})();
