<style>
/* Architect Zero — IT dashboard aesthetic. Palette-locked to design spec. */
:root {
  --navy: #1a2744; --cyan: #00e5ff; --error: #cc2200; --warn: #ffcc00;
  --gold: #ffaa00; --white: #f5f0e8; --gray: #4a5568; --midnight: #0d1b2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--midnight); color: var(--white);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
#game { width: 100vw; height: 100vh; }

.az-root { display: grid; grid-template-columns: 260px 1fr 260px; height: 100%; gap: 0; position: relative; }
.az-panel { background: rgba(13,27,42,0.92); border: 1px solid rgba(0,229,255,0.15);

.az-left { border-right: 2px solid rgba(0,229,255,0.25); }
.az-right { border-left: 2px solid rgba(0,229,255,0.25); }
.az-center { position: relative; background: var(--midnight); min-width: 0; }
.az-canvas { display: block; width: 100%; height: 100%; }

.az-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;

.az-section { margin-bottom: 16px; }
.az-h3 { font-size: 13px; letter-spacing: 0.05em; color: var(--cyan); margin: 0 0 8px;
  text-transform: uppercase; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 4px; }

.az-req-card { background: rgba(245,240,232,0.06); border: 1px solid var(--warn);
  border-radius: 8px; padding: 10px; }
.az-card-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.az-card-tip { font-size: 12px; color: rgba(245,240,232,0.7); line-height: 1.4; }
.az-card-need { font-size: 12px; font-weight: 600; margin-top: 6px; }

.az-palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.az-mod-btn { background: rgba(255,255,255,0.04); border: 2px solid; border-radius: 8px;

  align-items: center; gap: 2px; transition: transform 0.08s, background 0.1s; }
.az-mod-btn:hover { background: rgba(0,229,255,0.12); transform: translateY(-1px); }
.az-mod-btn.sel { background: rgba(0,229,255,0.25); box-shadow: 0 0 0 2px var(--cyan); }
.az-mod-glyph { font-size: 20px; }
.az-mod-name { font-size: 12px; font-weight: 700; }
.az-mod-size { font-size: 10px; color: rgba(245,240,232,0.6); }

.az-deck { display: flex; flex-wrap: wrap; gap: 4px; }
.az-deck-chip { font-size: 11px; padding: 4px 8px; border: 1px solid; border-radius: 12px;
  background: rgba(255,255,255,0.05); }
.az-deck-chip.usable { cursor: pointer; background: rgba(255,170,0,0.15); }
.az-deck-chip.usable:hover { background: rgba(255,170,0,0.3); }
.az-philosophy { margin-top: 8px; font-size: 11px; color: var(--gold); background: rgba(255,170,0,0.1);

.az-synergy { font-size: 40px; font-weight: 800; color: var(--gold); text-align: center; }

.az-sub { color: rgba(245,240,232,0.7); font-size: 16px; }

.az-title .az-btn { max-width: 280px; margin: 8px auto; }

.az-briefing { display: flex; gap: 24px; align-items: center; text-align: left; }
.az-portrait { position: relative; flex-shrink: 0; }
.az-portrait-img { width: 200px; height: 300px; object-fit: contain;

.az-pattern-card h3, .az-path-card h3 { margin: 6px 0; }
.az-pattern-card p, .az-path-card p { font-size: 13px; line-height: 1.4; color: rgba(245,240,232,0.8); }
.az-pc-syn { color: var(--gold); font-weight: 700; margin-top: 8px; }
.az-path-icon { font-size: 40px; text-align: center; }

.az-stat { text-align: center; }
.az-stat-val { font-size: 32px; font-weight: 800; color: var(--cyan); }
.az-stat-label { font-size: 12px; color: rgba(245,240,232,0.6); }

.az-ending .az-grade { font-size: 100px; font-weight: 900; line-height: 1; }
.az-grade-S .az-grade { color: var(--gold); text-shadow: 0 0 30px var(--gold); }
.az-grade-A .az-grade { color: var(--cyan); }
.az-grade-B .az-grade { color: #66ccff; }
.az-grade-C .az-grade { color: var(--warn); }
.az-grade-F .az-grade { color: var(--error); }
.az-constraints { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }

/* tutorial overlay */
.az-tutorial { max-width: 560px; text-align: center; background: rgba(13,27,42,0.96);
  border: 2px solid var(--cyan); border-radius: 16px; padding: 32px 28px;
  box-shadow: 0 0 40px rgba(0,229,255,0.25); }
.az-tut-icon { font-size: 56px; line-height: 1; margin-bottom: 8px; }
.az-tutorial h2 { color: var(--cyan); margin: 8px 0; }
.az-tutorial p { font-size: 16px; line-height: 1.7; color: rgba(245,240,232,0.9); min-height: 84px; }
.az-tut-dots { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
.az-tut-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(245,240,232,0.25); }
.az-tut-dot.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.az-tut-nav { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 8px; }
.az-tut-nav .az-btn { width: auto; min-width: 110px; margin: 0; }
.az-tut-step { font-size: 13px; color: rgba(245,240,232,0.6); min-width: 48px; }

.az-toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(13,27,42,0.95); border: 1px solid var(--cyan); color: var(--white); padding: 10px 20px;
  border-radius: 8px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 50;
  font-size: 14px; }
.az-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* responsive: stack panels on narrow screens (mobile) */
@media (max-width: 820px) {
  .az-root { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  .az-left, .az-right { border: none; max-height: 30vh; }
  .az-palette { grid-template-columns: repeat(4, 1fr); }
  .az-therm { height: 60px; }
  .az-briefing { flex-direction: column; text-align: center; }
}

</style>

/* ===== rng.js ===== */
// Deterministic seeded PRNG (mulberry32). Pure, no globals — enables reproducible
// simulation (seed=42) and identical replay. Never uses Math.random.
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const rng = () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (n) => Math.floor(rng() * n);
  rng.pick = (arr) => arr[rng.int(arr.length)];
  rng.shuffle = (arr) => {
    const a2 = arr.slice();
    for (let i = a2.length - 1; i > 0; i--) {
      const j = rng.int(i + 1);
      [a2[i], a2[j]] = [a2[j], a2[i]];
    }
    return a2;
  };
  return rng;
}
