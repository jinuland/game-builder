/* ===== audio.js ===== */
// Procedural audio via Web Audio API. All sound synthesized at runtime — no
// external asset files, so no licensing concerns. 3 BGM tracks (calm/tension/audit)
// via looping oscillator patterns + 9 SFX moments. Only starts after user gesture.
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.bgmGain = null;
    this.sfxGain = null;
    this.currentTrack = null;
    this.bgmNodes = [];
    this.bgmTimer = null;
    this.enabled = true;
    this.started = false;
    this.muted = false;
  }

  // Must be called from a user gesture (click) to satisfy autoplay policy.
  init() {
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.35;
    this.bgmGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.7;
    this.sfxGain.connect(this.master);
    this.started = true;
  }

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.6;
  }

  // ---- SFX -----------------------------------------------------------------
  _blip(freq, dur, type = 'sine', vol = 0.5, glide = 0) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + glide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  _chord(freqs, dur, type = 'triangle', vol = 0.35) {
    freqs.forEach((f, i) => setTimeout(() => this._blip(f, dur, type, vol), i * 60));
  }

  _noise(dur, vol = 0.4) {
    if (!this.started || this.muted) return;
    const t = this.ctx.currentTime;
    const bufSize = this.ctx.sampleRate * dur;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.value = vol;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 800;
    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);
    src.start(t);
  }

  place() { this._blip(880, 0.12, 'sine', 0.4, 220); }                 // crisp click
  cardAdd() { this._blip(500, 0.18, 'sawtooth', 0.3, 400); }           // whoosh up
  synergyCombo() { this._chord([523, 659, 784, 1046], 0.35, 'triangle', 0.3); } // rising chord
  debtWarn() { this._blip(110, 0.4, 'square', 0.35, -30); }            // low buzzer
  incident() { this._noise(0.3, 0.5); this._blip(180, 0.3, 'square', 0.3, -80); } // glitch
  recover() { this._blip(300, 0.25, 'sine', 0.35, 300); this._chord([440, 660], 0.3, 'sine', 0.25); } // reboot
  roadmap(tone) { this._blip([392, 523, 659][tone] || 440, 0.5, 'triangle', 0.3); } // path preview
  fanfare() { this._chord([523, 659, 784, 1046, 1318], 0.5, 'triangle', 0.35); }    // S grade
  crash() { this._blip(200, 0.6, 'sawtooth', 0.4, -180); this._noise(0.5, 0.5); }   // power-down

  // ---- BGM -----------------------------------------------------------------
  // Simple looped arpeggio patterns; track determines scale + tempo.
  playTrack(name) {
    if (!this.started || this.currentTrack === name) return;
    this.currentTrack = name;
    this._stopBgm(0.8);
    const scales = {
      calm: { notes: [220, 277, 330, 415, 330, 277], bpm: 92, type: 'triangle' },
      tension: { notes: [196, 233, 196, 155, 233, 277], bpm: 132, type: 'sawtooth' },
      audit: { notes: [262, 330, 392, 523, 392, 330], bpm: 108, type: 'triangle' },
    };
    const cfg = scales[name] || scales.calm;
    const interval = 60000 / cfg.bpm / 2;
    let i = 0;
    const step = () => {
      if (this.currentTrack !== name || this.muted) return;
      const f = cfg.notes[i % cfg.notes.length];
      this._bgmNote(f, interval / 1000 * 1.4, cfg.type);
      if (i % cfg.notes.length === 0) this._bgmNote(f / 2, interval / 1000 * 2.5, 'sine', 0.12); // bass
      i++;
    };
    step();
    this.bgmTimer = setInterval(step, interval);
  }

  _bgmNote(freq, dur, type, vol = 0.18) {
    if (!this.started) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bgmGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  _stopBgm() {
    if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
  }

  stopAll() { this._stopBgm(); this.currentTrack = null; }
}


/* ===== engine.js ===== */
// Core game engine — pure logic, no DOM. All mutations go through setters so
// state changes are traceable and testable (no external `state.x =` allowed).


const DEBT_MAX = 100;
const DEBT_WARN = 70;      // interest penalty threshold
const DEBT_INTEREST = 3;   // per-turn debt when > DEBT_WARN
const CRASH_RESET = 60;    // debt after a crash
const INCIDENT_DEADLINE = 3;

// ---- construction -------------------------------------------------------
function createGame(seed = 42) {
  const rng = makeRng(seed);
  return {
    seed,
    rng,
    actIndex: 0,
    turn: 1,
    techDebt: 0,
    synergy: 0,
    synergyBonus: 0,          // accumulated rewards/penalties/crisis bonuses (persist across recompute)
    deck: [],                 // pattern card ids
    grid: null,               // {cols, rows, cells: Int-> placement}
    placements: [],           // {id, moduleId, layer, cells:[[c,r]], down:bool, downTurnsLeft}
    hand: [],                 // requirement card ids for this act
    activeReq: null,          // current requirement card id
    incidents: [],            // active incident refs {placementId, turnsLeft}
    roadmap: null,            // chosen path id
    bossConstraints: [],      // constraint ids for act 5
    unmetStreak: 0,
    projectWarning: false,    // caps grade at A
    history: [],              // undo stack (per-turn placement snapshots)
    log: [],
    grade: null,
    ending: null,
    over: false,
    won: false,
    lastFDebt: null,          // for F->act4 restart carry
    telemetry: { acts: [], incidentsFired: 0, incidentsResolved: 0, incidentsTimedOut: 0, crashes: 0, cardPicks: {}, pathPicks: {} },
    _placeSeq: 1,
  };
}

// ---- setters (single mutation points) -----------------------------------
function setTechDebt(g, v) {
  g.techDebt = Math.max(0, Math.min(DEBT_MAX, Math.round(v)));
  return g.techDebt;
}
function addTechDebt(g, delta) { return setTechDebt(g, g.techDebt + delta); }
// Synergy = structural (recomputed from grid+deck) + persistent bonus (rewards/penalties).
// setSynergy overrides the bonus so total equals v after next recompute is folded in;
// used mainly by tests/sim to force a baseline.
function setSynergy(g, v) {
  g.synergyBonus = Math.round(v) - (g._structuralSynergy || 0);
  g.synergy = Math.max(0, Math.round(v));
  return g.synergy;
}
function addSynergy(g, delta) {
  g.synergyBonus += delta;
  g.synergy = Math.max(0, (g._structuralSynergy || 0) + g.synergyBonus);
  return g.synergy;
}

// ---- act / grid lifecycle ----------------------------------------------
function currentAct(g) { return ACTS[g.actIndex]; }

function startAct(g) {
  const act = currentAct(g);
  g.turn = 1;
  g.grid = makeGrid(act.cols, act.rows);
  g.placements = [];
  g.incidents = [];
  g.history = [];
  g.hand = g.rng.shuffle(act.reqPool).slice(0, Math.min(act.turns, act.reqPool.length));
  // ensure we have one requirement per turn (repeat pool if needed)
  while (g.hand.length < act.turns) g.hand.push(g.rng.pick(act.reqPool));
  g.activeReq = g.hand[0];
  g.telemetry.acts.push({ n: act.n, startTurn: g.turn, startDebt: g.techDebt, maxDebt: g.techDebt });
  return act;
}

function makeGrid(cols, rows) {
  return { cols, rows, cells: new Array(cols * rows).fill(null) };
}
function idx(g, c, r) { return r * g.grid.cols + c; }
function inBounds(g, c, r) { return c >= 0 && r >= 0 && c < g.grid.cols && r < g.grid.rows; }

// Which architecture layer does a column belong to? Grid split into 3 vertical bands:
// left band = edge, middle = compute, right = data. This is the spatial rule players learn.
function cellLayer(g, c) {
  const band = g.grid.cols / 3;
  if (c < band) return LAYERS[0];
  if (c < band * 2) return LAYERS[1];
  return LAYERS[2];
}

// rotate relative cells by 90° * times
function rotateCells(cells, times) {
  let out = cells.map(([c, r]) => [c, r]);
  for (let t = 0; t < ((times % 4) + 4) % 4; t++) {
    out = out.map(([c, r]) => [-r, c]);
  }
  // normalize to min 0,0
  const minC = Math.min(...out.map((p) => p[0]));
  const minR = Math.min(...out.map((p) => p[1]));
  return out.map(([c, r]) => [c - minC, r - minR]);
}

// Compute absolute cells for a module placed at anchor (ac,ar) with rotation.
function absCells(mod, ac, ar, rot) {
  const shape = mod.rotatable ? rotateCells(mod.cells, rot) : mod.cells;
  return shape.map(([c, r]) => [ac + c, ar + r]);
}

// Can a module be placed at anchor? Returns {ok, cells, reason}.
function canPlace(g, moduleId, ac, ar, rot = 0) {
  const mod = MODULES[moduleId];
  const cells = absCells(mod, ac, ar, rot);
  for (const [c, r] of cells) {
    if (!inBounds(g, c, r)) return { ok: false, cells, reason: 'out' };
    const occ = g.grid.cells[idx(g, c, r)];
    if (occ !== null) return { ok: false, cells, reason: 'occupied' };
  }
  return { ok: true, cells, reason: null };
}

// Place a module. Records undo snapshot. Returns placement or null.
function placeModule(g, moduleId, ac, ar, rot = 0) {
  const check = canPlace(g, moduleId, ac, ar, rot);
  if (!check.ok) return null;
  const mod = MODULES[moduleId];
  snapshot(g);
  const placement = {
    id: g._placeSeq++, moduleId, layer: mod.layer,
    cells: check.cells, anchor: [ac, ar], rot, down: false, downTurnsLeft: 0,
  };
  g.placements.push(placement);
  for (const [c, r] of check.cells) g.grid.cells[idx(g, c, r)] = placement.id;
  recompute(g);
  return placement;
}

// Remove a placement (used for relocation & crash). Does NOT snapshot by default.
function removePlacement(g, placementId, { snap = false } = {}) {
  if (snap) snapshot(g);
  const i = g.placements.findIndex((p) => p.id === placementId);
  if (i < 0) return false;
  const p = g.placements[i];
  for (const [c, r] of p.cells) {
    if (inBounds(g, c, r)) g.grid.cells[idx(g, c, r)] = null;
  }
  g.placements.splice(i, 1);
  // drop any incident referencing it
  g.incidents = g.incidents.filter((inc) => inc.placementId !== placementId);
  recompute(g);
  return true;
}

// ---- undo ----------------------------------------------------------------
function snapshot(g) {
  g.history.push({
    cells: g.grid.cells.slice(),
    placements: g.placements.map((p) => ({ ...p, cells: p.cells.map((x) => x.slice()) })),
    techDebt: g.techDebt,
    synergy: g.synergy,
    synergyBonus: g.synergyBonus,
    placeSeq: g._placeSeq,
  });
  if (g.history.length > 20) g.history.shift();
}
function undo(g) {
  const snap = g.history.pop();
  if (!snap) return false;
  g.grid.cells = snap.cells;
  g.placements = snap.placements;
  g._placeSeq = snap.placeSeq;
  setTechDebt(g, snap.techDebt);
  g.synergyBonus = snap.synergyBonus || 0;
  recompute(g);
  return true;
}

// ---- connection rules & tech debt ---------------------------------------
// A placement is "connected" if it is orthogonally adjacent to at least one other
// placement of the same or adjacent layer. Isolated/mismatched modules add debt.
function layerDistance(a, b) {
  return Math.abs(LAYERS.indexOf(a) - LAYERS.indexOf(b));
}

function neighborsOf(g, placement) {
  const seen = new Set();
  const out = [];
  for (const [c, r] of placement.cells) {
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (!inBounds(g, nc, nr)) continue;
      const pid = g.grid.cells[idx(g, nc, nr)];
      if (pid === null || pid === placement.id || seen.has(pid)) continue;
      seen.add(pid);
      out.push(g.placements.find((p) => p.id === pid));
    }
  }
  return out;
}

// Full evaluation of connection violations. Returns {violations, connectedCount}.
function evaluateConnections(g) {
  let violations = 0;
  const detail = [];
  for (const p of g.placements) {
    if (p.down) continue;
    const nbrs = neighborsOf(g, p).filter((n) => n && !n.down);
    if (g.placements.filter((x) => !x.down).length <= 1) continue; // lone first module ok
    if (nbrs.length === 0) {
      violations++; detail.push({ id: p.id, kind: 'isolated' });
      continue;
    }
    // any neighbor more than 1 layer away is a mismatch
    const bad = nbrs.some((n) => layerDistance(p.layer, n.layer) > 1);
    if (bad) { violations++; detail.push({ id: p.id, kind: 'mismatch' }); }
  }
  return { violations, detail };
}

// Overcrowding: if >75% of grid filled, extra debt pressure.
function crowding(g) {
  const filled = g.grid.cells.filter((x) => x !== null).length;
  const ratio = filled / g.grid.cells.length;
  return ratio > 0.75 ? Math.round((ratio - 0.75) * 40) : 0;
}

// Whether a family philosophy (3+ same-family cards) is active — halves debt from
// violations of modules in that family.
function activeFamilies(g) {
  const counts = {};
  for (const cid of g.deck) {
    const fam = PATTERN_CARDS[cid]?.family;
    if (fam) counts[fam] = (counts[fam] || 0) + 1;
  }
  return Object.keys(counts).filter((f) => counts[f] >= 3);
}

// Recompute derived metrics (debt from structure + synergy). Called after any change.
function recompute(g) {
  const { violations, detail } = evaluateConnections(g);
  const fams = activeFamilies(g);
  // structural debt: each violation +6, halved for modules whose family philosophy active
  let structDebt = 0;
  for (const d of detail) {
    const p = g.placements.find((x) => x.id === d.id);
    const mod = p && MODULES[p.moduleId];
    const famActive = mod && fams.includes(mod.family);
    structDebt += famActive ? 3 : 6;
  }
  structDebt += crowding(g);
  g._structDebt = structDebt;
  g._violations = violations;
  g._violationDetail = detail;
  g._structuralSynergy = computeSynergy(g);
  g.synergy = Math.max(0, g._structuralSynergy + (g.synergyBonus || 0));
  return { structDebt, violations, synergy: g.synergy };
}

// Synergy = sum of fired pattern cards (requires modules present) * path mult
// + adjacency bonus for same-family connected modules.
function computeSynergy(g) {
  const present = new Set(g.placements.filter((p) => !p.down).map((p) => p.moduleId));
  let s = 0;
  const fired = [];
  for (const cid of g.deck) {
    const card = PATTERN_CARDS[cid];
    if (!card) continue;
    const ok = card.requires.every((m) => present.has(m));
    if (ok && card.requires.length >= 0) {
      // layered "계층 분리" needs different layers
      if (card.id === 'p_layered_tier') {
        const db = g.placements.find((p) => p.moduleId === 'database' && !p.down);
        const gw = g.placements.find((p) => p.moduleId === 'api_gateway' && !p.down);
        if (db && gw && db.layer !== gw.layer) { s += card.synergy; fired.push(cid); }
        continue;
      }
      if (card.requires.length === 0 && !card.refactor) { s += card.synergy; fired.push(cid); continue; }
      if (card.requires.length > 0) { s += card.synergy; fired.push(cid); }
    }
  }
  // adjacency bonus: connected same-family module pairs +3 each (once per pair)
  const counted = new Set();
  for (const p of g.placements) {
    if (p.down) continue;
    for (const n of neighborsOf(g, p)) {
      if (!n || n.down) continue;
      const key = [p.id, n.id].sort((a, b) => a - b).join('-');
      if (counted.has(key)) continue;
      counted.add(key);
      if (MODULES[p.moduleId].family === MODULES[n.moduleId].family) s += 3;
    }
  }
  const mult = g.roadmap ? ROADMAP_PATHS[g.roadmap].synergyMult : 1;
  g._firedCards = fired;
  return Math.round(s * mult);
}

// ---- turn flow -----------------------------------------------------------
// Predict debt change if the turn ends now (for the end-turn popup).
function predictTurnEndDebt(g) {
  let delta = g._structDebt || 0;
  if (g.techDebt > DEBT_WARN) delta += DEBT_INTEREST;
  // unmet requirement
  if (!requirementMet(g)) delta += 4;
  // incident timeouts
  for (const inc of g.incidents) if (inc.turnsLeft <= 1) delta += 20;
  return delta;
}

function requirementMet(g) {
  if (!g.activeReq) return true;
  const need = REQUIREMENT_CARDS[g.activeReq].need;
  return g.placements.some((p) => p.moduleId === need && !p.down);
}

// End the current turn: apply structural debt, interest, requirement outcome,
// incident countdown, then either advance turn or trigger act-end.
function endTurn(g) {
  const act = currentAct(g);
  const events = [];

  // apply structural debt accrued this turn
  if (g._structDebt) { addTechDebt(g, g._structDebt); events.push({ t: 'debt', v: g._structDebt, why: 'struct' }); }

  // debt interest
  if (g.techDebt > DEBT_WARN) { addTechDebt(g, DEBT_INTEREST); events.push({ t: 'debt', v: DEBT_INTEREST, why: 'interest' }); }

  // requirement outcome (skip if no active requirement)
  if (!g.activeReq) {
    // no requirement this turn — no reward/penalty
  } else if (requirementMet(g)) {
    addSynergy(g, REQUIREMENT_CARDS[g.activeReq].reward);
    g.unmetStreak = 0;
    events.push({ t: 'reqMet', card: g.activeReq });
  } else {
    addSynergy(g, -10);
    g.unmetStreak++;
    if (g.unmetStreak >= 3) { g.projectWarning = true; events.push({ t: 'projectWarning' }); }
    events.push({ t: 'reqUnmet', card: g.activeReq });
  }

  // clean-design payoff: a tidy turn (requirement met, no connection violations,
  // no active incidents) pays down technical debt — elegant design reduces debt.
  if (g.activeReq && requirementMet(g) && (g._violations || 0) === 0 && g.incidents.length === 0) {
    addTechDebt(g, -6);
    events.push({ t: 'cleanTurn', v: -6 });
  }

  // incident countdown
  for (const inc of g.incidents) {
    inc.turnsLeft--;
    if (inc.turnsLeft <= 0) {
      addTechDebt(g, 20);
      g.telemetry.incidentsTimedOut++;
      // chain failure: down an adjacent module
      const p = g.placements.find((x) => x.id === inc.placementId);
      if (p) {
        const nbr = neighborsOf(g, p).find((n) => n && !n.down);
        if (nbr) { nbr.down = true; events.push({ t: 'chain', id: nbr.id }); }
      }
      events.push({ t: 'incidentTimeout', v: 20 });
    }
  }
  g.incidents = g.incidents.filter((inc) => inc.turnsLeft > 0);

  // crash check
  if (g.techDebt >= DEBT_MAX) { events.push(...crash(g)); }

  recompute(g);
  const tel = g.telemetry.acts[g.telemetry.acts.length - 1];
  if (tel) tel.maxDebt = Math.max(tel.maxDebt, g.techDebt);

  // fire incident at start of next turn (act 3+) with 60% chance, if modules exist
  const advance = advanceTurnOrAct(g, events, act);
  return { events, ...advance };
}

function advanceTurnOrAct(g, events, act) {
  g.history = []; // undo only within a turn
  if (g.turn >= act.turns) {
    return { actEnded: true };
  }
  g.turn++;
  g.activeReq = g.hand[Math.min(g.turn - 1, g.hand.length - 1)];
  // maybe spawn incident
  if (act.incidents) maybeSpawnIncident(g, events);
  recompute(g);
  return { actEnded: false };
}

// ---- incidents -----------------------------------------------------------
function maybeSpawnIncident(g, events = []) {
  const candidates = g.placements.filter((p) => !p.down);
  if (candidates.length === 0) return null;
  if (g.rng() > 0.6) return null;
  const target = g.rng.pick(candidates);
  target.down = true;
  const inc = g.rng.pick(Object.values(INCIDENTS));
  addTechDebt(g, inc.debt);
  const record = { placementId: target.id, incidentId: inc.id, turnsLeft: INCIDENT_DEADLINE };
  g.incidents.push(record);
  g.telemetry.incidentsFired++;
  events.push({ t: 'incident', inc: inc.id, placementId: target.id });
  recompute(g);
  return record;
}

// Resolve an incident by relocating the downed module to a new valid anchor.
function relocateModule(g, placementId, ac, ar, rot = 0) {
  const p = g.placements.find((x) => x.id === placementId);
  if (!p || !p.down) return { ok: false };
  const mod = p.moduleId;
  // free current cells first
  for (const [c, r] of p.cells) if (inBounds(g, c, r)) g.grid.cells[idx(g, c, r)] = null;
  const check = canPlace(g, mod, ac, ar, rot);
  if (!check.ok) {
    // restore
    for (const [c, r] of p.cells) g.grid.cells[idx(g, c, r)] = p.id;
    return { ok: false, reason: check.reason };
  }
  p.cells = check.cells; p.anchor = [ac, ar]; p.rot = rot; p.down = false;
  for (const [c, r] of check.cells) g.grid.cells[idx(g, c, r)] = p.id;
  return resolveIncidentSuccess(g, placementId);
}

// Use a failover pattern card to instantly restore a downed slot.
function useFailover(g, placementId) {
  const hasFailover = g.deck.some((cid) => PATTERN_CARDS[cid]?.failover);
  const p = g.placements.find((x) => x.id === placementId);
  if (!hasFailover || !p || !p.down) return { ok: false };
  p.down = false;
  return resolveIncidentSuccess(g, placementId);
}

function resolveIncidentSuccess(g, placementId) {
  const wasChained = g.incidents.some((inc) => inc.turnsLeft < INCIDENT_DEADLINE);
  g.incidents = g.incidents.filter((inc) => inc.placementId !== placementId);
  g.telemetry.incidentsResolved++;
  addTechDebt(g, -8); // relocation success reduces debt
  let bonus = 0;
  if (wasChained) { addSynergy(g, 15); bonus = 15; } // 위기 극복 bo/ crisis-overcome
  recompute(g);
  return { ok: true, crisisBonus: bonus };
}

// ---- crash ---------------------------------------------------------------
function crash(g) {
  const events = [{ t: 'crash' }];
  g.telemetry.crashes++;
  const removable = g.rng.shuffle(g.placements.map((p) => p.id)).slice(0, 3);
  for (const id of removable) removePlacement(g, id);
  setTechDebt(g, CRASH_RESET);
  events.push({ t: 'crashReset', v: CRASH_RESET, removed: removable.length });
  return events;
}

// ---- pattern draft -------------------------------------------------------
// Offer 3 pattern cards for the current act from unlocked pool (no dups already owned unless refactor).
function offerPatterns(g) {
  const act = currentAct(g);
  const pool = Object.values(PATTERN_CARDS).filter((c) => c.unlockAct <= act.n);
  const owned = new Set(g.deck.filter((cid) => !PATTERN_CARDS[cid].refactor));
  const avail = pool.filter((c) => c.refactor || !owned.has(c.id));
  return g.rng.shuffle(avail).slice(0, 3).map((c) => c.id);
}

function pickPattern(g, cardId) {
  g.deck.push(cardId);
  g.telemetry.cardPicks[cardId] = (g.telemetry.cardPicks[cardId] || 0) + 1;
  recompute(g);
  return g.synergy;
}

// Use refactor card effect (reduce debt). Reusable, stays in deck.
function useRefactor(g, cardId) {
  const card = PATTERN_CARDS[cardId];
  if (!card || !card.refactor || !g.deck.includes(cardId)) return false;
  addTechDebt(g, -card.refactor);
  recompute(g);
  return true;
}

// ---- roadmap (act 4) -----------------------------------------------------
function chooseRoadmap(g, pathId) {
  const path = ROADMAP_PATHS[pathId];
  if (!path) return false;
  g.roadmap = pathId;
  addTechDebt(g, path.debt);
  for (let i = 0; i < path.refactorCards; i++) g.deck.push('p_hybrid_refactor');
  if (path.extraSlots) g._extraSlots = path.extraSlots;
  g.bossConstraints = path.constraints.slice();
  g.telemetry.pathPicks[pathId] = (g.telemetry.pathPicks[pathId] || 0) + 1;
  recompute(g);
  return true;
}

// ---- audit / grade (act 5 end) ------------------------------------------
// Evaluate boss constraints and produce S~F grade + ending text.
function evaluateConstraints(g) {
  const present = new Set(g.placements.filter((p) => !p.down).map((p) => p.moduleId));
  const results = g.bossConstraints.map((cid) => {
    const con = CONSTRAINTS[cid];
    let met = true;
    if (con.need) met = present.has(con.need);
    if (con.maxDebt != null) met = g.techDebt <= con.maxDebt;
    if (con.minSynergy != null) met = g.synergy >= con.minSynergy;
    return { id: cid, name: con.name, met };
  });
  return results;
}

function computeGrade(g) {
  const cons = evaluateConstraints(g);
  const metCount = cons.filter((c) => c.met).length;
  const total = cons.length || 1;
  const metRatio = metCount / total;
  // score blends synergy (higher better) and debt (lower better) and constraint satisfaction
  const debtScore = Math.max(0, 100 - g.techDebt);        // 0..100
  const synScore = Math.min(100, g.synergy);              // 0..100
  const raw = synScore * 0.45 + debtScore * 0.35 + metRatio * 100 * 0.2;

  let grade;
  // Hard rule from spec: synergy>=80 & debt<=20 => S; debt hit 100 (crash flagged) handled by caller
  if (g.synergy >= 80 && g.techDebt <= 20 && metCount === total) grade = 'S';
  else if (raw >= 78 && metRatio >= 0.75) grade = 'A';
  else if (raw >= 60) grade = 'B';
  else if (raw >= 42) grade = 'C';
  else grade = 'F';

  if (g.projectWarning && grade === 'S') grade = 'A'; // warning caps at A
  return { grade, raw: Math.round(raw), constraints: cons, metCount, total };
}

const ENDINGS = {
  S: { title: '수석 아키텍트 임명', text: '우아한 아키텍처가 모든 제약을 시너지로 흡수했다. 이사회는 만장일치로 아키를 수석 아키텍트로 임명한다.' },
  A: { title: '신뢰받는 설계자', text: '견고한 설계로 감사를 통과했다. 아키는 팀의 핵심 설계자로 자리 잡는다.' },
  B: { title: '무사 통과', text: '몇 가지 부채를 남겼지만 시스템은 살아남았다. 다음엔 더 우아하게.' },
  C: { title: '아슬아슬한 승인', text: '조건부 승인. 기술 부채가 발목을 잡았지만 프로젝트는 계속된다.' },
  F: { title: '설계 재검토', text: '그리드는 기술 부채 앞에 무너졌다. 막 4로 돌아가 다른 경로를 택할 수 있다.' },
};

function finalizeAudit(g) {
  const { grade, raw, constraints, metCount, total } = computeGrade(g);
  g.grade = grade;
  g.ending = { grade, ...ENDINGS[grade], raw, constraints, metCount, total };
  const tel = g.telemetry.acts[g.telemetry.acts.length - 1];
  if (tel) { tel.synergy = g.synergy; tel.finalDebt = g.techDebt; tel.grade = grade; }
  if (grade === 'F') {
    g.lastFDebt = g.techDebt;
    g.won = false;
  } else {
    g.won = true;
  }
  g.over = true;
  return g.ending;
}

// F-grade -> restart from Act 4 roadmap with 50% debt carried.
function restartFromAct4(g) {
  g.actIndex = 3; // Act 4
  setTechDebt(g, Math.round((g.lastFDebt ?? g.techDebt) * 0.5));
  g.roadmap = null;
  g.bossConstraints = [];
  g.over = false;
  g.grade = null;
  g.ending = null;
  g.projectWarning = false;
  g.unmetStreak = 0;
  startAct(g);
  return g;
}

// Advance to next act. Returns false if no more acts (caller should finalize).
function nextAct(g) {
  if (g.actIndex >= ACTS.length - 1) return false;
  g.actIndex++;
  startAct(g);
  return true;
}

// ---- save / load ---------------------------------------------------------
function serialize(g) {
  return JSON.stringify({
    seed: g.seed, actIndex: g.actIndex, turn: g.turn, techDebt: g.techDebt,
    synergy: g.synergy, synergyBonus: g.synergyBonus, deck: g.deck, grid: g.grid, placements: g.placements,
    hand: g.hand, activeReq: g.activeReq, incidents: g.incidents, roadmap: g.roadmap,
    bossConstraints: g.bossConstraints, unmetStreak: g.unmetStreak,
    projectWarning: g.projectWarning, grade: g.grade, ending: g.ending,
    over: g.over, won: g.won, lastFDebt: g.lastFDebt, telemetry: g.telemetry,
    _placeSeq: g._placeSeq,
  });
}
function deserialize(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  const g = createGame(d.seed);
  Object.assign(g, d);
  g.rng = makeRng(d.seed); // note: rng stream position not restored (simulation uses fresh games)
  g.history = [];
  recompute(g);
  return g;
}


/* ===== render.js ===== */
// Canvas renderer for the architecture grid, modules, connections, and effects.
// Pure drawing — reads game state, never mutates it. Uses requestAnimationFrame
// driven by GameApp. Palette-consistent with content.PALETTE.


class GridRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.effects = [];        // transient particle/pulse effects
    this.shake = 0;           // camera shake amount (px)
    this.bgImage = null;      // current background <img>
    this.hover = null;        // {cells, ok} preview
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
  }

  setBackground(img) { this.bgImage = img; }

  // Compute cell geometry to fit canvas with padding.
  geom(g) {
    const W = this.canvas.width / this.dpr;
    const H = this.canvas.height / this.dpr;
    const pad = 24;
    const cell = Math.floor(Math.min((W - pad * 2) / g.grid.cols, (H - pad * 2) / g.grid.rows));
    const gw = cell * g.grid.cols;
    const gh = cell * g.grid.rows;
    const ox = Math.floor((W - gw) / 2);
    const oy = Math.floor((H - gh) / 2);
    return { cell, ox, oy, gw, gh, W, H };
  }

  cellAt(g, px, py) {
    const { cell, ox, oy } = this.geom(g);
    const c = Math.floor((px - ox) / cell);
    const r = Math.floor((py - oy) / cell);
    if (c < 0 || r < 0 || c >= g.grid.cols || r >= g.grid.rows) return null;
    return { c, r };
  }

  addEffect(e) { this.effects.push({ ...e, t0: performance.now() }); }
  triggerShake(px = 4, ms = 300) { this.shake = px; this._shakeUntil = performance.now() + ms; }

  // Debt-driven background temperature tint (blue->yellow->orange->red).
  debtTint(debt) {
    if (debt <= 30) return 'rgba(0,120,200,0.12)';
    if (debt <= 55) return 'rgba(230,200,0,0.12)';
    if (debt <= 75) return 'rgba(255,140,0,0.16)';
    return 'rgba(204,34,0,0.22)';
  }

  draw(g, now) {
    const ctx = this.ctx;
    const { cell, ox, oy, gw, gh, W, H } = this.geom(g);

    // camera shake
    let sx = 0, sy = 0;
    if (this.shake > 0 && now < this._shakeUntil) {
      sx = (Math.random() * 2 - 1) * this.shake;
      sy = (Math.random() * 2 - 1) * this.shake;
    } else this.shake = 0;

    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.translate(sx, sy);

    // background image or navy fill
    if (this.bgImage && this.bgImage.complete) {
      ctx.globalAlpha = 0.55;
      ctx.drawImage(this.bgImage, 0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(13,27,42,0.45)';
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = PALETTE.midnight;
      ctx.fillRect(0, 0, W, H);
    }

    // debt temperature overlay
    ctx.fillStyle = this.debtTint(g.techDebt);
    ctx.fillRect(0, 0, W, H);

    // layer bands (edge/compute/data) subtle labels
    const band = g.grid.cols / 3;
    const bandNames = ['엣지', '컴퓨트', '데이터'];
    for (let b = 0; b < 3; b++) {
      const bx = ox + Math.floor(band * b) * cell;
      const bw = Math.ceil(band) * cell;
      ctx.fillStyle = b % 2 === 0 ? 'rgba(74,85,104,0.10)' : 'rgba(74,85,104,0.04)';
      ctx.fillRect(bx, oy, bw, gh);
      ctx.fillStyle = 'rgba(245,240,232,0.35)';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(bandNames[b], bx + 4, oy - 6);
    }

    // grid lines
    ctx.strokeStyle = g.techDebt > 75 ? 'rgba(204,34,0,0.6)' : 'rgba(0,229,255,0.25)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= g.grid.cols; c++) {
      ctx.beginPath(); ctx.moveTo(ox + c * cell, oy); ctx.lineTo(ox + c * cell, oy + gh); ctx.stroke();
    }
    for (let r = 0; r <= g.grid.rows; r++) {
      ctx.beginPath(); ctx.moveTo(ox, oy + r * cell); ctx.lineTo(ox + gw, oy + r * cell); ctx.stroke();
    }

    // connection lines between adjacent compatible placements
    ctx.lineWidth = 3;
    const drawn = new Set();
    for (const p of g.placements) {
      if (p.down) continue;
      const pc = this._center(p, cell, ox, oy);
      for (const n of neighborsOf(g, p)) {
        if (!n || n.down) continue;
        const key = [p.id, n.id].sort((a, b) => a - b).join('-');
        if (drawn.has(key)) continue;
        drawn.add(key);
        const nc = this._center(n, cell, ox, oy);
        const dist = Math.abs(LAYERS.indexOf(p.layer) - LAYERS.indexOf(n.layer));
        ctx.strokeStyle = dist > 1 ? PALETTE.errorRed : (MODULES[p.moduleId].family === MODULES[n.moduleId].family ? PALETTE.synergyGold : PALETTE.cyan);
        ctx.beginPath(); ctx.moveTo(pc.x, pc.y); ctx.lineTo(nc.x, nc.y); ctx.stroke();
      }
    }

    // hover preview
    if (this.hover) {
      for (const [c, r] of this.hover.cells) {
        if (!inBounds(g, c, r)) continue;
        const x = ox + c * cell, y = oy + r * cell;
        ctx.fillStyle = this.hover.ok ? 'rgba(51,255,170,0.35)' : 'rgba(204,34,0,0.30)';
        ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4);
        if (!this.hover.ok) {
          ctx.strokeStyle = PALETTE.errorRed; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x + 8, y + 8); ctx.lineTo(x + cell - 8, y + cell - 8);
          ctx.moveTo(x + cell - 8, y + 8); ctx.lineTo(x + 8, y + cell - 8);
          ctx.stroke();
        }
      }
    }

    // placed modules
    for (const p of g.placements) this._drawModule(ctx, g, p, cell, ox, oy, now);

    // effects
    this._drawEffects(ctx, cell, ox, oy, now);

    ctx.restore();
  }

  _center(p, cell, ox, oy) {
    const xs = p.cells.map(([c]) => c), ys = p.cells.map(([, r]) => r);
    const cx = (Math.min(...xs) + Math.max(...xs) + 1) / 2;
    const cy = (Math.min(...ys) + Math.max(...ys) + 1) / 2;
    return { x: ox + cx * cell, y: oy + cy * cell };
  }

  _drawModule(ctx, g, p, cell, ox, oy, now) {
    const mod = MODULES[p.moduleId];
    const xs = p.cells.map(([c]) => c), ys = p.cells.map(([, r]) => r);
    const minC = Math.min(...xs), minR = Math.min(...ys);
    const maxC = Math.max(...xs), maxR = Math.max(...ys);
    const x = ox + minC * cell, y = oy + minR * cell;
    const w = (maxC - minC + 1) * cell, h = (maxR - minR + 1) * cell;

    ctx.save();
    // body
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    if (p.down) {
      grad.addColorStop(0, '#5a1a10'); grad.addColorStop(1, '#2a0a06');
    } else {
      grad.addColorStop(0, mod.color); grad.addColorStop(1, this._darken(mod.color, 0.5));
    }
    ctx.fillStyle = grad;
    this._roundRect(ctx, x + 3, y + 3, w - 6, h - 6, 6);
    ctx.fill();

    // outline (2px design system)
    ctx.strokeStyle = p.down ? PALETTE.errorRed : PALETTE.warmWhite;
    ctx.lineWidth = 2;
    this._roundRect(ctx, x + 3, y + 3, w - 6, h - 6, 6);
    ctx.stroke();

    // cel-shading highlight (upper-left)
    if (!p.down) {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      this._roundRect(ctx, x + 5, y + 5, w - 10, (h - 10) * 0.4, 4);
      ctx.fill();
    }

    // glyph + label
    ctx.fillStyle = p.down ? '#ff8877' : PALETTE.warmWhite;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${Math.floor(cell * 0.42)}px system-ui, sans-serif`;
    ctx.fillText(mod.glyph, x + w / 2, y + h / 2 - (cell * 0.08));
    ctx.font = `bold ${Math.floor(cell * 0.16)}px system-ui, sans-serif`;
    ctx.fillText(mod.short, x + w / 2, y + h - cell * 0.22);

    // down state: pulsing red X
    if (p.down) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 200);
      ctx.strokeStyle = `rgba(255,50,0,${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + w - 10, y + h - 10);
      ctx.moveTo(x + w - 10, y + 10); ctx.lineTo(x + 10, y + h - 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  _drawEffects(ctx, cell, ox, oy, now) {
    this.effects = this.effects.filter((e) => {
      const age = now - e.t0;
      const dur = e.dur || 500;
      if (age > dur) return false;
      const p = age / dur;
      const x = ox + (e.c + 0.5) * cell, y = oy + (e.r + 0.5) * cell;
      ctx.save();
      if (e.type === 'ripple') {
        ctx.strokeStyle = `rgba(0,229,255,${1 - p})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, p * cell * 1.4, 0, Math.PI * 2); ctx.stroke();
      } else if (e.type === 'pulse') {
        ctx.fillStyle = `rgba(255,170,0,${(1 - p) * 0.6})`;
        ctx.beginPath(); ctx.arc(x, y, (0.5 + p * 0.6) * cell, 0, Math.PI * 2); ctx.fill();
      } else if (e.type === 'crack') {
        ctx.strokeStyle = `rgba(204,34,0,${1 - p})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 + p;
          ctx.beginPath(); ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(a) * cell * 0.5 * p, y + Math.sin(a) * cell * 0.5 * p); ctx.stroke();
        }
      } else if (e.type === 'flash') {
        ctx.fillStyle = `rgba(51,255,170,${(1 - p) * 0.7})`;
        ctx.fillRect(x - cell / 2, y - cell / 2, cell, cell);
      } else if (e.type === 'sparkle') {
        // rising gold particle (S-grade)
        const ry = y - p * cell * 3;
        ctx.fillStyle = `rgba(255,170,0,${1 - p})`;
        ctx.beginPath(); ctx.arc(x + (e.dx || 0), ry, 3 * (1 - p) + 1, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      return true;
    });
  }

  _roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  _darken(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.floor(((n >> 16) & 255) * f);
    const g = Math.floor(((n >> 8) & 255) * f);
    const b = Math.floor((n & 255) * f);
    return `rgb(${r},${g},${b})`;
  }
}


/* ===== app.js ===== */
// GameApp — browser controller. Wires engine <-> renderer <-> audio <-> DOM UI.
// Handles input (mouse/touch/keyboard), scene flow, save/load, telemetry.




const SAVE_KEY = 'architect_zero_save_v1';
const ASSET_BASE = 'assets/';
const CHAR_FILES = { archi: 'char_archi.webp', kang: 'char_kang.webp', yoo: 'char_yoo.webp', incbot: 'char_incbot.webp' };
const BG_BY_ACT = { 1: 'bg_serverroom', 2: 'bg_serverroom', 3: 'bg_serverroom', 4: 'bg_roadmap', 5: 'bg_audit' };
const CHAR_NAMES = { archi: '아키', kang: '강 디렉터', yoo: '클라이언트 유 대리', incbot: '인시던트 봇' };

class GameApp {
  constructor(root, { seed = 42, timeScale = 1 } = {}) {
    this.root = root;
    this.seed = seed;
    this.timeScale = timeScale;
    this.audio = new AudioEngine();
    this.images = {};
    this.selectedModule = null;
    this.selectedRot = 0;
    this.dragging = null;      // {moduleId, rot} while dragging from palette
    this.pointer = { x: 0, y: 0, active: false };
    this.relocating = null;    // placementId being relocated
    this.scene = 'title';      // title | briefing | play | draft | roadmap | actend | audit | ending
    this.challengeMode = false;
    this.challengeUnlocked = localStorage.getItem('az_challenge_unlocked') === '1';
    this._build();
  }

  // ---- DOM scaffolding -----------------------------------------------------
  _build() {
    this.root.innerHTML = '';
    this.root.className = 'az-root';
    const canvas = document.createElement('canvas');
    canvas.className = 'az-canvas';
    this.canvas = canvas;

    this.leftPanel = this._panel('az-left');
    this.centerWrap = document.createElement('div');
    this.centerWrap.className = 'az-center';
    this.centerWrap.appendChild(canvas);
    this.overlay = document.createElement('div');
    this.overlay.className = 'az-overlay';
    this.centerWrap.appendChild(this.overlay);
    this.rightPanel = this._panel('az-right');

    this.root.appendChild(this.leftPanel);
    this.root.appendChild(this.centerWrap);
    this.root.appendChild(this.rightPanel);

    this.renderer = new GridRenderer(canvas);
    this._resize();
    window.addEventListener('resize', () => this._resize());

    this._bindInput();
    this._showTitle();
    this._loop();
  }

  _panel(cls) { const d = document.createElement('div'); d.className = `az-panel ${cls}`; return d; }

  _resize() {
    const rect = this.centerWrap.getBoundingClientRect();
    const dpr = this.renderer.dpr;
    const w = Math.max(320, rect.width || 800);
    const h = Math.max(320, rect.height || 600);
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.renderer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---- asset loading -------------------------------------------------------
  async loadAssets() {
    const load = (key, file) => new Promise((res) => {
      const img = new Image();
      img.onload = () => { this.images[key] = img; res(true); };
      img.onerror = () => { this.images[key] = null; res(false); };
      img.src = ASSET_BASE + file;
    });
    const jobs = [];
    for (const [k, f] of Object.entries(CHAR_FILES)) jobs.push(load(k, f));
    for (const b of ['bg_serverroom', 'bg_crisis', 'bg_roadmap', 'bg_audit']) jobs.push(load(b, b + '.webp'));
    await Promise.all(jobs);
  }

  // ---- game lifecycle ------------------------------------------------------
  newGame(seed = this.seed, challenge = false) {
    this.game = E.createGame(seed);
    this.challengeMode = challenge;
    this.audio.init(); this.audio.resume();
    if (challenge) { this.game.actIndex = 0; }
    E.startAct(this.game);
    this._markActStart();
    // Show the tutorial once before a player's first-ever game, then continue to briefing.
    if (localStorage.getItem('az_tut_seen') !== '1' && !challenge) {
      localStorage.setItem('az_tut_seen', '1');
      this._showTutorial(() => this._enterBriefing());
    } else {
      this._enterBriefing();
    }
  }

  _markActStart() {
    const act = E.currentAct(this.game);
    this._actStartTime = performance.now();
    this._updateBackground();
  }

  _updateBackground(crisis = false) {
    const act = E.currentAct(this.game);
    let key = BG_BY_ACT[act.n];
    if (crisis && this.game.incidents.length) key = 'bg_crisis';
    this.renderer.setBackground(this.images[key] || null);
  }

  save() {
    try {
      const data = { version: 1, save: E.serialize(this.game), scene: this.scene, challenge: this.challengeMode };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      return true;
    } catch { return false; }
  }
  hasSave() { return !!localStorage.getItem(SAVE_KEY); }
  loadSave() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    this.game = E.deserialize(data.save);
    this.challengeMode = !!data.challenge;
    this.audio.init(); this.audio.resume();
    E.startAct(this.game); // resume at first turn of saved act (per spec)
    this._markActStart();
    this._enterBriefing();
    return true;
  }

  // ---- scenes --------------------------------------------------------------
  _showTitle() {
    this.scene = 'title';
    this.leftPanel.innerHTML = '';
    this.rightPanel.innerHTML = '';
    this.renderer.setBackground(this.images.bg_serverroom || null);
    const cont = document.createElement('div');
    cont.className = 'az-title';
    cont.innerHTML = '';
    const h = document.createElement('h1'); h.textContent = '아키텍트 제로';
    const sub = document.createElement('p'); sub.className = 'az-sub'; sub.textContent = '설계자의 계단 — 그리드 배치 × 패턴 덱빌딩 퍼즐';
    const startBtn = this._btn('새 게임', () => this.newGame(this.seed));
    startBtn.classList.add('az-primary');
    cont.appendChild(h); cont.appendChild(sub); cont.appendChild(startBtn);
    if (this.hasSave()) cont.appendChild(this._btn('이어하기', () => this.loadSave()));
    if (this.challengeUnlocked) cont.appendChild(this._btn('챌린지 모드', () => this.newGame((this._chSeed = (Date.now() % 100000) + 1), true)));
    cont.appendChild(this._btn('❓ 게임 방법', () => this._showTutorial(() => this._showTitle())));
    const mute = this._btn('🔊 사운드', () => { const m = !this.audio.muted; this.audio.setMuted(m); mute.textContent = m ? '🔇 사운드' : '🔊 사운드'; });
    cont.appendChild(mute);
    const help = document.createElement('p'); help.className = 'az-help';
    help.textContent = '조작: 좌측 모듈 클릭→그리드 클릭 배치 · R 회전 · Ctrl+Z 취소 · Space 턴 종료';
    cont.appendChild(help);
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
  }

  // Step-by-step tutorial overlay. `onDone` runs when closed. Shown from title
  // ("게임 방법") and automatically once before the first playthrough.
  _showTutorial(onDone) {
    const prevScene = this.scene;
    this.scene = 'tutorial';
    const pages = [
      { icon: '🎯', h: '당신은 시스템 설계자', p: '제한된 그리드(서버 공간)에 모듈 블록을 배치해 클라이언트 요구사항을 맞추는 퍼즐입니다. 테트리스처럼 공간을 관리하면서, 카드로 아키텍처를 강화합니다.' },
      { icon: '📋', h: '1. 요구사항을 읽는다', p: '왼쪽 위 "요구사항 카드"가 필요한 모듈을 알려줍니다. 예: "빠른 응답 — 필요 모듈: 캐시" → 캐시 모듈을 그리드에 놓으면 됩니다.' },
      { icon: '🧩', h: '2. 모듈을 배치한다', p: '왼쪽 "모듈 팔레트"에서 모듈을 클릭해 선택하고, 가운데 그리드의 빈 칸을 클릭해 놓습니다. 초록 칸=배치 가능, 빨간 X=불가. R키로 회전할 수 있어요.' },
      { icon: '🔗', h: '3. 모듈을 붙여 놓는다', p: '모듈끼리 이웃하게 놓으면 연결됩니다. 뚝 떨어뜨리거나 엉뚱한 레이어(엣지/컴퓨트/데이터)에 놓으면 "기술 부채"가 오릅니다.' },
      { icon: '📊', h: '두 개의 핵심 숫자', p: '오른쪽 온도계 = 기술 부채(낮을수록 좋음, 100이면 크래시). 금색 숫자 = 시너지 점수(높을수록 좋음). 이 둘의 균형이 최종 등급(S~F)을 정합니다.' },
      { icon: '⏭', h: '4. 턴을 종료한다', p: '요구 모듈을 놓았으면 오른쪽 "턴 종료(Space)"를 누릅니다. 다음 요구사항이 나옵니다. 막 2부터는 패턴 카드(3장 중 1장)를 골라 덱을 만들고, 막 3부터는 장애 이벤트에 대응합니다.' },
    ];
    let i = 0;
    const cont = document.createElement('div'); cont.className = 'az-tutorial';
    const render = () => {
      const pg = pages[i];
      cont.innerHTML = '';
      const icon = document.createElement('div'); icon.className = 'az-tut-icon'; icon.textContent = pg.icon;
      const h = document.createElement('h2'); h.textContent = pg.h;
      const p = document.createElement('p'); p.textContent = pg.p;
      const dots = document.createElement('div'); dots.className = 'az-tut-dots';
      pages.forEach((_, k) => { const d = document.createElement('span'); d.className = 'az-tut-dot' + (k === i ? ' on' : ''); dots.appendChild(d); });
      const nav = document.createElement('div'); nav.className = 'az-tut-nav';
      if (i > 0) nav.appendChild(this._btn('◀ 이전', () => { i--; render(); }));
      const step = document.createElement('div'); step.className = 'az-tut-step'; step.textContent = `${i + 1} / ${pages.length}`;
      nav.appendChild(step);
      const nextBtn = this._btn(i === pages.length - 1 ? '시작하기 ▶' : '다음 ▶', () => {
        if (i === pages.length - 1) { this.scene = prevScene; if (onDone) onDone(); }
        else { i++; render(); }
      });
      nextBtn.classList.add('az-primary');
      nav.appendChild(nextBtn);
      cont.appendChild(icon); cont.appendChild(h); cont.appendChild(p); cont.appendChild(dots); cont.appendChild(nav);
    };
    render();
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
  }

  _enterBriefing() {
    const act = E.currentAct(this.game);
    this.scene = 'briefing';
    const cont = document.createElement('div');
    cont.className = 'az-briefing';
    const charKey = act.character;
    const img = this.images[charKey];
    const portrait = document.createElement('div');
    portrait.className = 'az-portrait';
    if (img) { const im = new Image(); im.src = img.src; im.className = 'az-portrait-img'; portrait.appendChild(im); }
    const speaker = document.createElement('div'); speaker.className = 'az-speaker'; speaker.textContent = CHAR_NAMES[charKey] || '';
    portrait.appendChild(speaker);
    const box = document.createElement('div'); box.className = 'az-briefing-box';
    const title = document.createElement('h2'); title.textContent = act.title;
    const text = document.createElement('p'); text.textContent = act.briefing;
    const go = this._btn('설계 시작', () => this._enterPlayWithSteps());
    go.classList.add('az-primary');
    box.appendChild(title); box.appendChild(text); box.appendChild(go);
    cont.appendChild(portrait); cont.appendChild(box);
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
    this._updateBackground();
    this.audio.playTrack(act.boss ? 'audit' : 'calm');
  }

  _enterPlay() {
    const act = E.currentAct(this.game);
    this.scene = 'play';
    this.overlay.style.display = 'none';
    this.overlay.innerHTML = '';
    // maybe show client Yoo dropping requirement (act has requirements always)
    this._renderPanels();
    this._updateBackground();
    if (act.boss) this._setupBoss();
    // onboarding hint on the very first turn of act 1 (no tutorial wall, just a nudge)
    if (act.n === 1 && this.game.turn === 1 && !this._onboarded) {
      this._onboarded = true;
      this._toast('왼쪽에서 모듈을 고르고 그리드 칸을 클릭해 배치하세요. 요구사항 모듈을 놓으면 시너지를 얻습니다.', 4500);
    }
  }

  _setupBoss() {
    // ensure constraints exist (if player skipped roadmap somehow)
    if (!this.game.bossConstraints.length) this.game.bossConstraints = ROADMAP_PATHS.fast.constraints.slice();
  }

  // pattern draft between acts (acts that allow patterns, shown at act start after briefing? we show at act end -> next act). We trigger draft at start of play for acts 2+.
  _enterDraft() {
    this.scene = 'draft';
    const offers = E.offerPatterns(this.game);
    this._pendingOffers = offers;
    const cont = document.createElement('div'); cont.className = 'az-draft';
    const img = this.images.kang;
    if (img) { const im = new Image(); im.src = img.src; im.className = 'az-draft-portrait'; cont.appendChild(im); }
    const h = document.createElement('h2'); h.textContent = '패턴 드래프트 — 3장 중 1장 선택'; cont.appendChild(h);
    const p = document.createElement('p'); p.className = 'az-sub'; p.textContent = '일관된 아키텍처 방향이 시너지를 키운다. 같은 계열 3장이면 기술 부채 발생이 절반으로 줄어든다.'; cont.appendChild(p);
    const row = document.createElement('div'); row.className = 'az-card-row';
    for (const cid of offers) row.appendChild(this._patternCardEl(cid, true));
    cont.appendChild(row);
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
  }

  _pickPattern(cid) {
    E.pickPattern(this.game, cid);
    this.audio.cardAdd();
    this.audio.synergyCombo();
    this._enterPlay();
  }

  _enterRoadmap() {
    this.scene = 'roadmap';
    const cont = document.createElement('div'); cont.className = 'az-roadmap';
    const h = document.createElement('h2'); h.textContent = '로드맵 분기 — 다음 스프린트 경로를 선택하라'; cont.appendChild(h);
    const row = document.createElement('div'); row.className = 'az-card-row';
    let tone = 0;
    for (const [pid, path] of Object.entries(ROADMAP_PATHS)) {
      const el = document.createElement('div'); el.className = 'az-path-card';
      const myTone = tone++;
      el.innerHTML = '';
      const icon = document.createElement('div'); icon.className = 'az-path-icon'; icon.textContent = path.icon;
      const nm = document.createElement('h3'); nm.textContent = path.name;
      const tip = document.createElement('p'); tip.textContent = path.tip;
      const preview = document.createElement('div'); preview.className = 'az-path-preview';
      preview.textContent = '예상 보스 제약: ' + path.constraints.map((c) => CONSTRAINTS[c].name).join(' · ');
      const btn = this._btn('이 경로 선택', () => this._chooseRoadmap(pid));
      el.appendChild(icon); el.appendChild(nm); el.appendChild(tip); el.appendChild(preview); el.appendChild(btn);
      el.addEventListener('mouseenter', () => this.audio.roadmap(myTone));
      row.appendChild(el);
    }
    cont.appendChild(row);
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
  }

  _chooseRoadmap(pid) {
    E.chooseRoadmap(this.game, pid);
    this.audio.roadmap(0);
    this._toast(`${ROADMAP_PATHS[pid].name} 경로 선택. 기술 부채 ${ROADMAP_PATHS[pid].debt >= 0 ? '+' : ''}${ROADMAP_PATHS[pid].debt}`);
    // roadmap acts also allow patterns -> chain into draft
    if (this._pendingDraft) { this._pendingDraft = false; this._enterDraft(); return; }
    this.overlay.style.display = 'none';
    this.scene = 'play';
    this._enterPlay();
  }

  // ---- turn / act flow -----------------------------------------------------
  endTurn() {
    if (this.scene !== 'play') return;
    const predict = E.predictTurnEndDebt(this.game);
    const res = E.endTurn(this.game);
    // handle events -> effects/audio
    this._applyEvents(res.events);
    if (this.game.techDebt > E.DEBT_WARN) this.audio.debtWarn();
    this.save();
    if (res.actEnded) {
      this._onActEnd();
    } else {
      // incident spawn feedback
      if (res.events.some((e) => e.t === 'incident')) {
        this.renderer.triggerShake(5, 300);
        this.audio.incident();
        this._updateBackground(true);
        this.audio.playTrack('tension');
      }
      this._renderPanels();
    }
  }

  _applyEvents(events) {
    for (const e of events) {
      if (e.t === 'crash') { this.audio.crash(); this.renderer.triggerShake(8, 500); this._toast('시스템 크래시! 모듈 강제 제거, 기술 부채 60으로 리셋'); }
      if (e.t === 'incident') {
        const p = this.game.placements.find((x) => x.id === e.placementId);
        if (p) for (const [c, r] of p.cells) this.renderer.addEffect({ type: 'crack', c, r, dur: 500 });
      }
      if (e.t === 'chain') this._toast('연쇄 장애! 인접 모듈이 추가로 다운됨');
      if (e.t === 'incidentTimeout') this._toast('장애 미해결 — 기술 부채 +20');
      if (e.t === 'projectWarning') this._toast('프로젝트 경고! 최종 감사 등급 상한이 A로 제한됨');
    }
  }

  _onActEnd() {
    const act = E.currentAct(this.game);
    if (act.boss) { this._enterAudit(); return; }
    this.scene = 'actend';
    const cont = document.createElement('div'); cont.className = 'az-actend';
    const h = document.createElement('h2'); h.textContent = `${act.title} 완료`;
    const stats = document.createElement('div'); stats.className = 'az-actend-stats';
    stats.appendChild(this._stat('시너지 점수', this.game.synergy));
    stats.appendChild(this._stat('기술 부채', this.game.techDebt));
    stats.appendChild(this._stat('배치 모듈', this.game.placements.length));
    const next = this._btn('다음 막으로', () => this._advance());
    next.classList.add('az-primary');
    cont.appendChild(h); cont.appendChild(stats); cont.appendChild(next);
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
  }

  _advance() {
    const prevAct = E.currentAct(this.game);
    if (!E.nextAct(this.game)) { this._enterAudit(); return; }
    this._markActStart();
    const act = E.currentAct(this.game);
    this._enterBriefing();
    // schedule draft/roadmap after briefing via _enterPlay override
    this._pendingDraft = act.patterns;
    this._pendingRoadmap = !!act.roadmap;
  }

  // Override play entry to inject draft/roadmap steps
  _enterPlayWithSteps() {
    if (this._pendingRoadmap) { this._pendingRoadmap = false; this._enterRoadmap(); return; }
    if (this._pendingDraft) { this._pendingDraft = false; this._enterDraft(); return; }
    this._enterPlay();
  }

  _enterAudit() {
    this.scene = 'audit';
    const ending = E.finalizeAudit(this.game);
    this._updateBackground();
    this.renderer.setBackground(this.images.bg_audit || null);
    if (ending.grade === 'S') {
      this.audio.fanfare();
      // sparkle burst
      for (let i = 0; i < 40; i++) {
        this.renderer.addEffect({ type: 'sparkle', c: Math.random() * this.game.grid.cols, r: this.game.grid.rows - 1, dx: (Math.random() - 0.5) * 30, dur: 1500 });
      }
    } else if (ending.grade === 'F') { this.audio.crash(); this.renderer.triggerShake(8, 500); }
    else this.audio.synergyCombo();

    if (ending.grade !== 'F' && !this.challengeUnlocked) {
      this.challengeUnlocked = true; localStorage.setItem('az_challenge_unlocked', '1');
    }
    this._showEnding(ending);
  }

  _showEnding(ending) {
    this.scene = 'ending';
    const cont = document.createElement('div'); cont.className = 'az-ending az-grade-' + ending.grade;
    const gEl = document.createElement('div'); gEl.className = 'az-grade'; gEl.textContent = ending.grade;
    const h = document.createElement('h2'); h.textContent = ending.title;
    const p = document.createElement('p'); p.textContent = ending.text;
    const cons = document.createElement('div'); cons.className = 'az-constraints';
    for (const c of ending.constraints) {
      const row = document.createElement('div');
      row.className = 'az-con ' + (c.met ? 'met' : 'unmet');
      row.textContent = `${c.met ? '✅' : '❌'} ${c.name}`;
      cons.appendChild(row);
    }
    const stats = document.createElement('div'); stats.className = 'az-actend-stats';
    stats.appendChild(this._stat('최종 시너지', this.game.synergy));
    stats.appendChild(this._stat('기술 부채', this.game.techDebt));
    stats.appendChild(this._stat('충족 제약', `${ending.metCount}/${ending.total}`));
    cont.appendChild(gEl); cont.appendChild(h); cont.appendChild(p); cont.appendChild(cons); cont.appendChild(stats);

    if (ending.grade === 'F') {
      const retry = this._btn('막 4 재검토 (기술 부채 50% 유지)', () => {
        E.restartFromAct4(this.game); this._markActStart(); localStorage.removeItem(SAVE_KEY);
        this._enterBriefing(); this._pendingRoadmap = true;
      });
      retry.classList.add('az-primary');
      cont.appendChild(retry);
    } else {
      cont.appendChild(this._btn('타이틀로', () => { localStorage.removeItem(SAVE_KEY); this._showTitle(); }));
      if (this.challengeUnlocked) cont.appendChild(this._btn('챌린지 모드', () => this.newGame((Date.now() % 100000) + 1, true)));
    }
    this.overlay.innerHTML = ''; this.overlay.appendChild(cont);
    this.overlay.style.display = 'flex';
    this.audio.stopAll();
  }

  // ---- panels (UI) ---------------------------------------------------------
  _renderPanels() {
    this._renderLeft();
    this._renderRight();
  }

  _renderLeft() {
    const act = E.currentAct(this.game);
    const g = this.game;
    this.leftPanel.innerHTML = '';
    // active requirement
    const reqBox = document.createElement('div'); reqBox.className = 'az-section';
    reqBox.appendChild(this._h3('요구사항 카드'));
    if (g.activeReq) {
      const req = REQUIREMENT_CARDS[g.activeReq];
      const need = MODULES[req.need];
      const card = document.createElement('div'); card.className = 'az-req-card';
      const met = E.requirementMet(g);
      card.innerHTML = '';
      const nm = document.createElement('div'); nm.className = 'az-card-name'; nm.textContent = req.name;
      const tip = document.createElement('div'); tip.className = 'az-card-tip'; tip.textContent = req.tip;
      const needEl = document.createElement('div'); needEl.className = 'az-card-need';
      needEl.textContent = `필요 모듈: ${need.name} ${met ? '✅ 충족' : '⚠ 미충족'}`;
      needEl.style.color = met ? PALETTE.cyan : PALETTE.warnYellow;
      const rw = document.createElement('div'); rw.className = 'az-card-tip'; rw.textContent = `보상 시너지 +${req.reward}`;
      card.appendChild(nm); card.appendChild(tip); card.appendChild(needEl); card.appendChild(rw);
      reqBox.appendChild(card);
    }
    this.leftPanel.appendChild(reqBox);

    // module palette
    const palBox = document.createElement('div'); palBox.className = 'az-section';
    palBox.appendChild(this._h3('모듈 팔레트'));
    const grid = document.createElement('div'); grid.className = 'az-palette';
    for (const mod of Object.values(MODULES)) {
      if (mod.unlockAct > act.n) continue;
      const b = document.createElement('button');
      b.className = 'az-mod-btn' + (this.selectedModule === mod.id ? ' sel' : '');
      b.style.borderColor = mod.color;
      b.title = mod.tip;
      const shape = mod.cells.length;
      b.innerHTML = '';
      const gl = document.createElement('span'); gl.className = 'az-mod-glyph'; gl.textContent = mod.glyph; gl.style.color = mod.color;
      const nm = document.createElement('span'); nm.className = 'az-mod-name'; nm.textContent = mod.short;
      const sz = document.createElement('span'); sz.className = 'az-mod-size'; sz.textContent = `${shape}칸${mod.rotatable ? ' ↻' : ''}`;
      b.appendChild(gl); b.appendChild(nm); b.appendChild(sz);
      b.addEventListener('click', () => this._selectModule(mod.id));
      grid.appendChild(b);
    }
    palBox.appendChild(grid);
    this.leftPanel.appendChild(palBox);

    // deck
    if (g.deck.length) {
      const deckBox = document.createElement('div'); deckBox.className = 'az-section';
      deckBox.appendChild(this._h3(`패턴 덱 (${g.deck.length})`));
      const list = document.createElement('div'); list.className = 'az-deck';
      const counts = {};
      g.deck.forEach((c) => counts[c] = (counts[c] || 0) + 1);
      for (const [cid, n] of Object.entries(counts)) {
        const card = PATTERN_CARDS[cid];
        const chip = document.createElement('div'); chip.className = 'az-deck-chip';
        chip.style.borderColor = FAMILIES[card.family].color;
        chip.textContent = card.name + (n > 1 ? ` ×${n}` : '');
        chip.title = card.text;
        if (card.refactor) {
          chip.classList.add('usable');
          chip.addEventListener('click', () => { if (E.useRefactor(g, cid)) { this._toast(`리팩터링: 기술 부채 -${card.refactor}`); this.audio.recover(); this._renderPanels(); } });
        }
        list.appendChild(chip);
      }
      deckBox.appendChild(list);
      // active family philosophy
      const fams = E.activeFamilies(g);
      if (fams.length) {
        const ph = document.createElement('div'); ph.className = 'az-philosophy';
        ph.textContent = '⚙ 아키텍처 철학: ' + fams.map((f) => FAMILIES[f].name).join(', ') + ' (부채 발생 절반)';
        deckBox.appendChild(ph);
      }
      this.leftPanel.appendChild(deckBox);
    }
  }

  _renderRight() {
    const g = this.game; const act = E.currentAct(this.game);
    this.rightPanel.innerHTML = '';
    // tech debt thermometer
    const debtBox = document.createElement('div'); debtBox.className = 'az-section';
    debtBox.appendChild(this._h3('기술 부채'));
    const therm = document.createElement('div'); therm.className = 'az-therm';
    const fill = document.createElement('div'); fill.className = 'az-therm-fill';
    fill.style.height = g.techDebt + '%';
    fill.style.background = this._debtColor(g.techDebt);
    therm.appendChild(fill);
    const val = document.createElement('div'); val.className = 'az-therm-val'; val.textContent = g.techDebt;
    const wrap = document.createElement('div'); wrap.className = 'az-therm-wrap';
    wrap.appendChild(therm); wrap.appendChild(val);
    debtBox.appendChild(wrap);
    if (g.techDebt > E.DEBT_WARN) {
      const warn = document.createElement('div'); warn.className = 'az-warn'; warn.textContent = '⚠ 부채 이자 +3/턴';
      debtBox.appendChild(warn);
    }
    this.rightPanel.appendChild(debtBox);

    // synergy
    const synBox = document.createElement('div'); synBox.className = 'az-section';
    synBox.appendChild(this._h3('시너지 점수'));
    const syn = document.createElement('div'); syn.className = 'az-synergy'; syn.textContent = g.synergy;
    synBox.appendChild(syn);
    this.rightPanel.appendChild(synBox);

    // act progress / roadmap minimap
    const mapBox = document.createElement('div'); mapBox.className = 'az-section';
    mapBox.appendChild(this._h3('로드맵'));
    const mini = document.createElement('div'); mini.className = 'az-minimap';
    for (const a of ACTS) {
      const dot = document.createElement('div');
      dot.className = 'az-map-dot' + (a.n === act.n ? ' cur' : (a.n < act.n ? ' done' : ''));
      dot.textContent = a.n;
      dot.title = a.title;
      mini.appendChild(dot);
    }
    mapBox.appendChild(mini);
    const turnInfo = document.createElement('div'); turnInfo.className = 'az-turninfo';
    turnInfo.textContent = `막 ${act.n} · 턴 ${g.turn}/${act.turns}`;
    mapBox.appendChild(turnInfo);
    if (g.roadmap) {
      const rp = document.createElement('div'); rp.className = 'az-turninfo';
      rp.textContent = '경로: ' + ROADMAP_PATHS[g.roadmap].name;
      mapBox.appendChild(rp);
    }
    this.rightPanel.appendChild(mapBox);

    // boss constraints (act 5)
    if (act.boss && g.bossConstraints.length) {
      const bc = document.createElement('div'); bc.className = 'az-section';
      bc.appendChild(this._h3('감사 제약'));
      const cons = E.evaluateConstraints(g);
      for (const c of cons) {
        const row = document.createElement('div'); row.className = 'az-con ' + (c.met ? 'met' : 'unmet');
        row.textContent = `${c.met ? '✅' : '⬜'} ${c.name}`;
        row.title = CONSTRAINTS[c.id].tip;
        bc.appendChild(row);
      }
      this.rightPanel.appendChild(bc);
    }

    // incidents
    if (g.incidents.length) {
      const incBox = document.createElement('div'); incBox.className = 'az-section az-incident';
      incBox.appendChild(this._h3('⚠ 활성 장애'));
      for (const inc of g.incidents) {
        const row = document.createElement('div'); row.className = 'az-inc-row';
        row.textContent = `${INCIDENTS[inc.incidentId].name} — ${inc.turnsLeft}턴 내 복구`;
        incBox.appendChild(row);
      }
      const hint = document.createElement('div'); hint.className = 'az-card-tip';
      hint.textContent = '다운된 슬롯(빨간 X)을 클릭 → 빈 칸 클릭으로 재배치';
      incBox.appendChild(hint);
      this.rightPanel.appendChild(incBox);
    }

    // end turn button
    const endBtn = this._btn(`턴 종료 (Space)`, () => this._confirmEndTurn());
    endBtn.classList.add('az-primary', 'az-endturn');
    this.rightPanel.appendChild(endBtn);
    const undoBtn = this._btn('취소 (Ctrl+Z)', () => this._undo());
    this.rightPanel.appendChild(undoBtn);
    const helpBtn = this._btn('❓ 게임 방법', () => this._showTutorial(() => { this.overlay.style.display = 'none'; this.scene = 'play'; this._renderPanels(); }));
    this.rightPanel.appendChild(helpBtn);
  }

  _confirmEndTurn() {
    const predict = E.predictTurnEndDebt(this.game);
    const sign = predict >= 0 ? '+' : '';
    this._toast(`턴 종료 — 예상 기술 부채 ${sign}${predict}`, 1200);
    this.endTurn();
  }

  // ---- input ---------------------------------------------------------------
  _selectModule(id) {
    this.selectedModule = id;
    this.selectedRot = 0;
    this.relocating = null;
    this._renderLeft();
  }

  _bindInput() {
    const c = this.canvas;
    const getXY = (ev) => {
      const rect = c.getBoundingClientRect();
      const t = ev.touches ? ev.touches[0] : ev;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    };
    const onMove = (ev) => {
      if (this.scene !== 'play') return;
      const { x, y } = getXY(ev);
      this.pointer = { x, y, active: true };
      this._updateHover(x, y);
    };
    const onDown = (ev) => {
      if (this.scene !== 'play') return;
      this.audio.resume();
      const { x, y } = getXY(ev);
      this._onClick(x, y);
      ev.preventDefault();
    };
    c.addEventListener('mousemove', onMove);
    c.addEventListener('mousedown', onDown);
    c.addEventListener('mouseleave', () => { this.renderer.hover = null; this.pointer.active = false; });
    c.addEventListener('touchstart', onDown, { passive: false });
    c.addEventListener('touchmove', (ev) => { onMove(ev); ev.preventDefault(); }, { passive: false });

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'r' || ev.key === 'R') { this._rotate(); }
      else if (ev.key === ' ') { if (this.scene === 'play') { ev.preventDefault(); this._confirmEndTurn(); } }
      else if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); this._undo(); }
      else if (ev.key === 'Escape') { this.renderer.hover = null; this.selectedModule = null; this.relocating = null; this._renderLeft(); }
    });

    // shake gesture (mobile) -> undo, via devicemotion
    if (window.DeviceMotionEvent) {
      let last = 0;
      window.addEventListener('devicemotion', (ev) => {
        const a = ev.accelerationIncludingGravity; if (!a) return;
        const mag = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
        const now = performance.now();
        if (mag > 40 && now - last > 1000) { last = now; this._undo(); }
      });
    }
  }

  _rotate() {
    if (this.scene !== 'play') return;
    if (this.selectedModule && MODULES[this.selectedModule].rotatable) {
      this.selectedRot = (this.selectedRot + 1) % 4;
      if (this.pointer.active) this._updateHover(this.pointer.x, this.pointer.y);
      this.audio.place();
    }
  }

  _updateHover(x, y) {
    const g = this.game;
    if (!g || !g.grid) return;
    const cell = this.renderer.cellAt(g, x, y);
    if (!cell || !this.selectedModule) { this.renderer.hover = null; return; }
    const chk = E.canPlace(g, this.selectedModule, cell.c, cell.r, this.selectedRot);
    this.renderer.hover = { cells: chk.cells, ok: chk.ok };
  }

  _onClick(x, y) {
    const g = this.game;
    const cell = this.renderer.cellAt(g, x, y);
    if (!cell) return;

    // relocating a downed module
    if (this.relocating != null) {
      const res = E.relocateModule(g, this.relocating, cell.c, cell.r, this.selectedRot);
      if (res.ok) {
        this.audio.recover();
        this.renderer.addEffect({ type: 'flash', c: cell.c, r: cell.r, dur: 400 });
        this._updateBackground();
        if (!g.incidents.length) this.audio.playTrack(E.currentAct(g).boss ? 'audit' : 'calm');
        if (res.crisisBonus) this._toast(`위기 극복! 시너지 +${res.crisisBonus}`);
        this.relocating = null;
        this._renderPanels();
      } else {
        this._toast('그 위치에는 재배치할 수 없습니다');
      }
      return;
    }

    // clicking a downed module selects it for relocation
    const pid = g.grid.cells[E.idx(g, cell.c, cell.r)];
    if (pid != null) {
      const p = g.placements.find((x2) => x2.id === pid);
      if (p && p.down) {
        // failover option if available
        const hasFO = g.deck.some((cid) => PATTERN_CARDS[cid]?.failover);
        if (hasFO) {
          const res = E.useFailover(g, pid);
          if (res.ok) { this.audio.recover(); this.renderer.addEffect({ type: 'flash', c: cell.c, r: cell.r, dur: 400 }); if (res.crisisBonus) this._toast(`위기 극복! 시너지 +${res.crisisBonus}`); this._updateBackground(); this._renderPanels(); return; }
        }
        this.relocating = pid; this.selectedModule = p.moduleId; this.selectedRot = 0;
        this._toast('재배치할 빈 칸을 클릭하세요');
        return;
      }
    }

    // place selected module
    if (this.selectedModule) {
      const placement = E.placeModule(g, this.selectedModule, cell.c, cell.r, this.selectedRot);
      if (placement) {
        this.audio.place();
        for (const [c, r] of placement.cells) this.renderer.addEffect({ type: 'ripple', c, r, dur: 400 });
        // synergy combo detection
        const before = g._prevSynergy || 0;
        if (g.synergy > before + 10) { this.audio.synergyCombo(); for (const [c, r] of placement.cells) this.renderer.addEffect({ type: 'pulse', c, r, dur: 600 }); }
        g._prevSynergy = g.synergy;
        this._renderPanels();
      } else {
        this._toast('배치 불가: 겹치거나 범위를 벗어남');
      }
    }
  }

  _undo() {
    if (this.scene !== 'play') return;
    if (E.undo(this.game)) { this.audio.place(); this._renderPanels(); this._toast('마지막 배치 취소'); }
  }

  // ---- helpers -------------------------------------------------------------
  _patternCardEl(cid, selectable) {
    const card = PATTERN_CARDS[cid];
    const el = document.createElement('div'); el.className = 'az-pattern-card';
    el.style.borderColor = FAMILIES[card.family].color;
    const fam = document.createElement('div'); fam.className = 'az-pc-fam'; fam.textContent = FAMILIES[card.family].name; fam.style.color = FAMILIES[card.family].color;
    const nm = document.createElement('h3'); nm.textContent = card.name;
    const txt = document.createElement('p'); txt.textContent = card.text;
    const syn = document.createElement('div'); syn.className = 'az-pc-syn'; syn.textContent = card.synergy ? `시너지 +${card.synergy}` : '';
    el.appendChild(fam); el.appendChild(nm); el.appendChild(txt); el.appendChild(syn);
    if (selectable) { el.classList.add('sel'); el.addEventListener('click', () => this._pickPattern(cid)); }
    return el;
  }

  _btn(label, onClick) {
    const b = document.createElement('button'); b.className = 'az-btn'; b.textContent = label;
    b.addEventListener('click', () => { this.audio.resume(); onClick(); });
    return b;
  }
  // Drive the game to a named state for screenshot evidence (browser validation).
  // States: briefing, play1, play1full, draft, incident, roadmap, boss, endingS.
  __driveTo(state) {
    const place = (mid) => {
      const g = this.game; let best = null, ba = -1;
      for (let r = 0; r < g.grid.rows; r++) for (let c = 0; c < g.grid.cols; c++) {
        const chk = E.canPlace(g, mid, c, r, 0); if (!chk.ok) continue;
        let adj = 0; for (const [cc, rr] of chk.cells) for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) { const ni=(rr+dr)*g.grid.cols+(cc+dc); if (g.grid.cells[ni]!=null) adj++; }
        if (adj > ba) { ba = adj; best = { c, r }; }
      }
      if (best) return E.placeModule(g, mid, best.c, best.r, 0);
      return null;
    };
    if (state === 'tutorial') { this._showTutorial(() => {}); return; }
    localStorage.setItem('az_tut_seen', '1'); // skip auto-tutorial for scripted states
    this.newGame(42);
    if (state === 'briefing') return;
    this._enterPlayWithSteps();
    if (state === 'play1') return;
    if (state === 'play1full') {
      place('api_gateway'); place('cache'); place('database'); this._renderPanels(); return;
    }
    // advance to act 2 draft
    if (state === 'draft') {
      place('api_gateway'); place('cache'); this.endTurn(); this.endTurn(); this.endTurn();
      return; // actend -> click needed; instead force advance
    }
    if (state === 'boss' || state === 'endingS' || state === 'incident' || state === 'roadmap') {
      // fast-forward engine to target act, then sync scene
      const target = state === 'incident' ? 2 : (state === 'roadmap' ? 3 : 4);
      while (this.game.actIndex < target) {
        const act = E.currentAct(this.game);
        if (act.patterns) { const o = E.offerPatterns(this.game); const m = o.find((x)=>x.startsWith('p_micro'))||o[0]; if (m) E.pickPattern(this.game, m); }
        if (act.roadmap) E.chooseRoadmap(this.game, 'innovation');
        for (let t=0;t<act.turns;t++){ const need=REQUIREMENT_CARDS[this.game.activeReq]?.need; if(need) place(need); place('cache'); E.endTurn(this.game); }
        E.nextAct(this.game); this._markActStart();
      }
      if (state === 'roadmap') { this._enterRoadmap(); return; }
      if (state === 'incident') { E.maybeSpawnIncident(this.game); this.scene='play'; this.overlay.style.display='none'; this._updateBackground(true); this._renderPanels(); return; }
      if (state === 'boss') {
        E.chooseRoadmap(this.game, 'innovation');
        this.scene='play'; this.overlay.style.display='none'; this._enterPlay(); this._renderPanels(); return;
      }
      if (state === 'endingS') {
        E.chooseRoadmap(this.game, 'innovation');
        place('autoscaler'); place('cache'); place('api_gateway');
        E.setSynergy(this.game, 88); E.setTechDebt(this.game, 12);
        this._enterAudit(); return;
      }
    }
  }

  // Map requirement card id -> needed module id (used by validation harness).
  __reqNeedMap() {
    const m = {};
    for (const [id, r] of Object.entries(REQUIREMENT_CARDS)) m[id] = r.need;
    return m;
  }
  _h3(t) { const h = document.createElement('h3'); h.className = 'az-h3'; h.textContent = t; return h; }
  _stat(label, val) {
    const d = document.createElement('div'); d.className = 'az-stat';
    const v = document.createElement('div'); v.className = 'az-stat-val'; v.textContent = val;
    const l = document.createElement('div'); l.className = 'az-stat-label'; l.textContent = label;
    d.appendChild(v); d.appendChild(l); return d;
  }
  _debtColor(d) {
    if (d <= 30) return 'linear-gradient(0deg,#0088cc,#00e5ff)';
    if (d <= 55) return 'linear-gradient(0deg,#ffcc00,#ffe066)';
    if (d <= 75) return 'linear-gradient(0deg,#ff8800,#ffaa00)';
    return 'linear-gradient(0deg,#cc2200,#ff4422)';
  }
  _toast(msg, ms = 2000) {
    let t = this.root.querySelector('.az-toast');
    if (!t) { t = document.createElement('div'); t.className = 'az-toast'; this.root.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---- main loop -----------------------------------------------------------
  _loop() {
    const frame = (now) => {
      if (this.game && this.game.grid) this.renderer.draw(this.game, now);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);

var params = new URLSearchParams(location.search);
var seed = parseInt(params.get('seed') || '42', 10);
var app = new GameApp(document.getElementById('game'), { seed: seed });
window.__AZ = app;
// patch asset loading to use inlined data URLs
var _origLoad = app.loadAssets.bind(app);
app.loadAssets = function(){
  var CHAR = { archi:'char_archi.webp', kang:'char_kang.webp', yoo:'char_yoo.webp', incbot:'char_incbot.webp' };
  var BGS = ['bg_serverroom','bg_crisis','bg_roadmap','bg_audit'];
  var jobs = [];
  var self = this;
  function load(key, file){ return new Promise(function(res){ var img=new Image(); img.onload=function(){self.images[key]=img;res(true);}; img.onerror=function(){self.images[key]=null;res(false);}; img.src = __AZ_ASSETS[file] || ''; }); }
  for (var k in CHAR) jobs.push(load(k, CHAR[k]));
  BGS.forEach(function(b){ jobs.push(load(b, b+'.webp')); });
  return Promise.all(jobs);
};
app.loadAssets().then(function(){ app._showTitle(); window.__AZ_READY = true; });

})();
