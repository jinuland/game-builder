<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>스노우 로얄 (Snow Royale)</title><style>
/* Snow Royale — cold snow-battle-royale UI. Palette per spec. */
:root {
  --white:#F5F5F5; --ice:#A8D8EA; --navy:#1B2A4A; --orange:#FF6B35;
  --slate:#4A4A5A; --gold:#D4A017; --crimson:#DC143C; --aurora:#7FFFD4; --grey:#9E9E9E;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--navy); color: var(--white);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
#game { width: 100vw; height: 100vh; }
.sr-root { position: relative; width: 100%; height: 100%; background: var(--navy); }
.sr-canvas { position: absolute; inset: 0; display: block; cursor: crosshair; width: 100%; height: 100%; }
.sr-fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

.sr-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(27,42,74,0.72); backdrop-filter: blur(4px); z-index: 20; }

/* title */
.sr-title, .sr-result { text-align: center; max-width: 640px; padding: 20px; }
.sr-title h1 { font-size: 56px; margin: 0; color: var(--ice); text-shadow: 0 0 24px rgba(168,216,234,0.6); letter-spacing: 0.05em; }
.sr-sub { color: rgba(245,245,245,0.75); font-size: 16px; }
.sr-diffrow { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
.sr-diff { background: rgba(255,255,255,0.08); border: 1px solid var(--ice); color: var(--white); border-radius: 8px; padding: 8px 18px; cursor: pointer; }
.sr-diff.on { background: var(--ice); color: var(--navy); font-weight: 700; }
.sr-btn { display: block; width: 260px; margin: 8px auto; padding: 12px; background: rgba(255,255,255,0.08);
  border: 1px solid var(--ice); border-radius: 10px; color: var(--white); font-size: 15px; cursor: pointer; }
.sr-btn:hover { background: rgba(168,216,234,0.2); }
.sr-btn.primary { background: var(--orange); border-color: var(--orange); color: #1a0d00; font-weight: 700; }
.sr-btn.primary:hover { background: #ff8355; }
.sr-foot { font-size: 12px; color: rgba(245,245,245,0.55); margin-top: 16px; line-height: 1.5; }

/* result */
.sr-place { font-size: 84px; font-weight: 900; line-height: 1; }
.sr-win .sr-place { color: var(--gold); text-shadow: 0 0 30px var(--gold); }
.sr-lose .sr-place { color: var(--ice); }
.sr-rstats { display: flex; gap: 26px; justify-content: center; margin: 18px 0; }
.sr-stat-v { font-size: 30px; font-weight: 800; color: var(--ice); }
.sr-stat-l { font-size: 12px; color: rgba(245,245,245,0.6); }

/* modal */
.sr-modal { position: absolute; inset: 0; background: rgba(13,27,42,0.85); display: flex; align-items: center; justify-content: center; z-index: 40; }
.sr-modal-box { background: var(--navy); border: 1px solid var(--ice); border-radius: 14px; padding: 24px; max-width: 560px; }
.sr-modal-box h2 { color: var(--ice); margin-top: 0; }
.sr-modal-box p { line-height: 1.6; font-size: 14px; color: rgba(245,245,245,0.9); }

/* HUD */
.sr-hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-size: 14px; }
.sr-hud-top { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; align-items: center;
  background: rgba(13,27,42,0.7); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(168,216,234,0.3); }
.sr-hud-surv { font-weight: 800; color: var(--aurora); }
.sr-hud-act { color: var(--ice); font-size: 13px; }
.sr-hud-zone { color: var(--orange); font-weight: 700; font-size: 13px; }
.sr-hud-bl { position: absolute; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 6px; width: 240px; }
.sr-hp { position: relative; height: 26px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); transform: skewX(-8deg); }
.sr-hp-fill { position: absolute; inset: 0; transition: width 0.12s; }
.sr-hp-txt { position: relative; display: block; text-align: center; line-height: 26px; font-size: 15px; font-weight: 800; text-shadow: 0 1px 2px #000; transform: skewX(8deg); }
.sr-tac { font-size: 12px; color: var(--ice); text-shadow: 0 1px 2px #000; }
.sr-drop { font-size: 13px; color: var(--orange); font-weight: 700; }
/* FPS-style ammo counter bottom-right */
.sr-hud-br { position: absolute; right: 24px; bottom: 20px; text-align: right; }
.sr-ammo-big { font-size: 52px; font-weight: 900; line-height: 1; color: var(--white); text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.sr-ammo-cap { font-size: 10px; letter-spacing: 0.2em; color: var(--ice); margin: 2px 0 6px; }
/* kill feed */
.sr-killfeed { position: absolute; right: 16px; top: 56px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.sr-kf-row { background: rgba(13,27,42,0.72); border-left: 3px solid var(--orange); color: var(--white); font-size: 12px; padding: 4px 10px; border-radius: 3px; }
.sr-minimap { position: absolute; right: 16px; top: 16px; border: 2px solid var(--ice); border-radius: 8px; overflow: hidden; }
.sr-toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(13,27,42,0.92);
  border: 1px solid var(--orange); color: var(--white); padding: 10px 18px; border-radius: 8px; font-size: 14px; max-width: 80%; text-align: center; }

@media (max-width: 720px) {
  .sr-title h1 { font-size: 40px; }
  .sr-btn { width: 220px; }
  .sr-hud-bl { width: 170px; }
}

/* class selection on title */
.sr-classrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 620px; margin: 6px auto 14px; }
.sr-class { background: rgba(255,255,255,0.07); border: 1px solid rgba(168,216,234,0.4); border-radius: 10px;
  padding: 10px 12px; color: var(--white); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.sr-class b { font-size: 13px; color: var(--ice); }
.sr-class span { font-size: 11px; color: rgba(245,245,245,0.65); line-height: 1.4; }
.sr-class.on { border-color: var(--orange); background: rgba(255,107,53,0.16); }
.sr-class.on b { color: var(--orange); }
/* shield & class HUD tags */
.sr-shield { font-size: 13px; font-weight: 800; color: #4d9fff; text-shadow: 0 1px 2px #000; }
.sr-class-tag { font-size: 11px; color: rgba(245,245,245,0.7); text-shadow: 0 1px 2px #000; }
/* pill buff HUD tags */
.sr-buff { font-size: 13px; font-weight: 800; color: #ffd43b; text-shadow: 0 1px 2px #000; }
.sr-buff-mg { color: #ff8f5a; animation: sr-mg-pulse 0.8s ease-in-out infinite; }
@keyframes sr-mg-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

</style></head>
