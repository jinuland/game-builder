# Deploys the "아키텍트 제로" game (public/game) to GitHub Pages.
# Enable: repo Settings → Pages → Source: GitHub Actions. Then push to main branch.
name: Deploy Architect Zero to Pages

on:
  push:
    branches: [main, master, agent/game-builder-publish]
    paths:
      - 'public/game/**'
      - '.github/workflows/deploy-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (game at root)
        run: |
          mkdir -p _site
          cp -r public/game/* _site/
          # redirect root to the game
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./index.html">' > _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
